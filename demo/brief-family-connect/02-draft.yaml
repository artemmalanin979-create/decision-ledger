# Черновик решения Decision Ledger · кейс: brief-family-connect
# Единая продуктовая стратегия из 5 частей по учебному брифу ПАО «МегаФон»

title: "Связь для близких и собственных устройств: ступенчатая проактивная защита от потери интернета"
summary: |
  Приоритет 1-го полугодия — семейные группы на тарифах с общим пакетом интернета (доступная база 100 000 домохозяйств, 6 500 подключённых на старте): запускаем упреждающий пороговый сигнал организатору и идемпотентное выделение ГБ со статусом pending при раздельном отзываемом согласии участника, а во 2-м полугодии переиспользуем тот же движок без шага приглашения для владельцев нескольких собственных номеров (доступная база 40 000, старт 800). В основном сценарии (допущения модели) решение выводит валовую прибыль с 279 до 285,59 млн руб. (+14 080 доп. оплаченных номер-месяцев по 500 руб. минус 0,45 млн руб. прямых OPEX) при отдельном CAPEX 10,0 чел.-мес. (порог окупаемости за плановый год — ставка до 659 тыс. руб./чел.-мес.); пилот Q2 защищён жёсткими стоп-правилами по мгновенному отзыву согласий и нулевому допуску двойных списаний.
recommended: opt_phased_shield

reviewed: auto
review_notes:
  brief_pdf: "Проверены все 11 страниц учебного брифа: доступные базы (100 тыс. и 40 тыс. без пересечений), пятистрочная таблица, правила 14-дневной активации со всеми созданными группами, ставка 500 руб./мес., календарные лимиты и матрица ресурсов."
  brief_model: "Проверена детерминированная сценарная спецификация brief-calc (пилот Q2, основной сценарий main и неблагоприятный сценарий adverse)."

findings:
  f01_market_and_dedup:
    kind: fact
    text: |
      На учебном рынке помощь со связью нужна 300 000 домохозяйств и 180 000 владельцев нескольких собственных номеров; с учётом действующих тарифов и способов привлечения оператору доступны 100 000 домохозяйств и 40 000 владельцев, причём клиенты, подходящие под оба описания, уже учтены только в составе домохозяйств (исключён двойной счёт базы при сохранении обоих сценариев в продукте).
    cite:
      - brief_pdf: "стр. 3, раздел Рынок и исходные показатели"

  f02_scorecard_baseline:
    kind: fact
    text: |
      Исходные и целевые ориентиры брифа: валовая прибыль — базовый год 282 млн руб. (план) и 275 млн руб. (оценка), плановый год 279 млн руб. (без изменений) и цель не ниже 285 млн руб. (разрыв +6 млн руб.); активные семейные группы за последний месяц — 5 000 / 4 000 в базовом году, 5 000 без изменений и цель 8 000; подключённые семейные группы на конец года — 7 500 / 6 500 в базовом году, 8 000 без изменений и цель 12 000; подключённые владельцы нескольких номеров — 1 000 / 800 в базовом году, 1 000 без изменений и цель 2 000; 14-дневная активация групп, созданных в Q4 — 50% / 42% в базовом году, 45% без изменений и цель не ниже 60%.
    cite:
      - brief_pdf: "стр. 3, таблица Базовый год и Плановый год"

  f03_metric_definitions:
    kind: fact
    text: |
      Строгие правила расчёта показателей: (1) семейная группа подключена, пока помимо организатора в ней есть минимум один участник, а владелец подключён при объединении минимум двух собственных номеров; (2) группа активна в календарном месяце, если подключена на конец месяца и кто-то посмотрел остаток общего пакета или выделил интернет участнику; (3) 14-дневная активация в Q4 отсчитывается от создания группы, включает в знаменатель все созданные группы вместе с приглашениями без ответа и подводится через 14 полных дней после окончания Q4; (4) учебная ставка валовой прибыли равна 500 руб. за один дополнительный оплаченный месяц одного номера внутри планового года (не более 13 - M месяцев для запуска в месяце M), а затраты на разработку считаются отдельно.
    cite:
      - brief_pdf: "стр. 3, определения показателей; стр. 9, Как рассчитать прибыль и окупаемость"

  f04_current_capabilities_and_roles:
    kind: fact
    text: |
      Сегодня организатор семейной группы уже может вручную добавить интернет из свободного остатка общего пакета, а владелец нескольких номеров — переключаться между ними в личном кабинете, однако об исчерпании интернета или денег клиенты нередко узнают лишь после перебоя. Организатор, участник и плательщик могут быть разными людьми; согласие участника на просмотр остатка интернета выдаётся отдельно от согласия на просмотр начислений и отзывается в любой момент; оператору известны сведения о номере, но не заряд батареи роутера без достоверных данных от самого устройства.
    cite:
      - brief_pdf: "стр. 1, Как люди пользуются связью сегодня; стр. 4-5, Различите сигнал и причину и Покажите весь путь"

  f05_team_and_governance_constraints:
    kind: fact
    text: |
      Руководитель направления назначен; к концу Q1 требуется решение о выделении ресурсов на пилот, к концу Q2 совместно с финансовой командой — решение о расширении охвата, доработке, продлении наблюдения или остановке. Ресурсные ограничения старта: по 0,5 ставки дизайнера и аналитика ещё предстоит выделить, на Q2 предварительно выделено 3,0 чел.-мес. разработки, а 1,0 чел.-мес. специалиста по проверке услуги (тестированию) пока не подтверждён.
    cite:
      - brief_pdf: "стр. 1, развилки Q1-Q2; стр. 11, таблица Ресурсы, риски и решение руководителя"

  f06_unknown_incident_and_channel_data:
    kind: unknown
    text: |
      В исходных материалах отсутствуют эмпирические частоты причин перебоев (доля исчерпания квоты ГБ против неоплаты счёта и выключенного питания роутера), рассказы конкретных клиентов, доля повторных обращений об одном случае, конверсия по каналам привлечения (приложение, поддержка, продажи), задержка обновления остатков в биллинге и фактические кривые удержания номеров. До снятия этих пробелов в Q1 по 6-месячным логам сети/биллинга и 12-15 клиентским интервью широкая разработка не открывается.
    deps: [f02_scorecard_baseline, f04_current_capabilities_and_roles]

  f07_unknown_dev_rate_rub:
    kind: unknown
    text: |
      Рублёвая стоимость одного человеко-месяца разработки, дизайна, аналитики и тестирования в брифе не задана. До получения внутренней финансовой ставки к гейту Q1/Q2 трудозатраты планируются в человеко-месяцах, а условие окупаемости задаётся формулой квартального возврата вложений и верхним порогом допустимой ставки человеко-месяца.
    deps: [f03_metric_definitions, f05_team_and_governance_constraints]

  f08_priority_assumption_with_threshold:
    kind: assumption
    text: |
      Проверяемое допущение первого приоритета до выгрузки логов Q1: среди подключённых семейных групп на совместимых тарифах минимум 25% групп за квартал сталкиваются со снижением выделенной доли участника к критическому порогу при наличии свободного остатка у организатора (поток не менее 200 впервые подходящих уникальных групп в неделю в Q2), а доля 7-дневных ограничений интернета в этой когорте риска снижается с 18,0% в контроле до 11,0% или ниже в тесте (-7,0 п.п., или -38,89% относительно контроля). Порог смены приоритета в Q1: если поток подходящих групп окажется ниже 100 в неделю или свыше 60% перебоев и оттока в семьях вызваны просрочкой счёта плательщика и непонятными списаниями, MVP Q2 переключается на упреждающий контроль даты/суммы списания и расшифровку начислений.
    deps: [f02_scorecard_baseline, f04_current_capabilities_and_roles, f06_unknown_incident_and_channel_data]

  f09_channel_and_activation_assumptions:
    kind: assumption
    text: |
      Сценарные допущения воронки привлечения и активации (brief_model): при строгой дедупликации касаний по первому целевому контакту за 14 дней (приложение > CVM-сообщения > поддержка и продажи) основной сценарий добавляет сверх прогноза без изменений +4 200 семейных групп (+3 300 новых и +900 сохранённых при прямых затратах 252 тыс. руб., или 60 руб. на добавленную группу -> итог 12 200 групп и 8 296 активных при доле активности 68,0%) и с августа за счёт переиспользования движка без шага приглашения +1 050 владельцев нескольких номеров (+880 новых и +170 сохранённых при затратах 42 тыс. руб., или 40 руб. на владельца -> итог 2 050). В Q4 из 2 000 созданных групп 1 560 принимают приглашение (440 неотвеченных/отказов остаются в знаменателе) и 1 240 совершают первое полезное действие за 14 дней (62,0% при цели не ниже 60%).
    deps: [f01_market_and_dedup, f02_scorecard_baseline, f03_metric_definitions, f06_unknown_incident_and_channel_data]

  f10_profit_bridge_and_capex_inference:
    kind: inference
    text: |
      Детерминированный расчёт brief-calc подтверждает: для закрытия разрыва +6,00 млн руб. (279 -> 285 млн руб.) по ставке 500 руб./мес. требуется минимум 12 000 дополнительных оплаченных номер-месяцев при нулевых новых прямых расходах и 12 900 номер-месяцев при 0,45 млн руб. новых прямых OPEX. С учётом календарного потолка 13 - M месяцев внутри планового года четыре когорты основного сценария (запуск в месяцах 5, 7, 8 и 10) приносят 14 080 оплаченных номер-месяцев (+7,04 млн руб.) и выводят валовую прибыль на 285,59 млн руб. (+0,59 млн руб. сверх цели) плюс 9,21 млн руб. переходящего эффекта в годы 2-3; при отдельном CAPEX 10,0 чел.-мес. годовая окупаемость выполняется при ставке до 659 000 руб./чел.-мес. В неблагоприятном сценарии (без подтверждённого QA, со сдвигом старта на 1 мес. и переносом мульти-SIM на 2-й год) валовая прибыль составляет 281,59 млн руб. (недобор -3,41 млн руб., или 6 820 номер-месяцев), подключённые семьи — 10 400 (-1 600), активные — 6 760 (-1 240), мульти-SIM — 1 000 (-1 000), активация Q4 — 54,0% (-6,0 п.п.).
    cite:
      - brief_model: "scenarios.main, scenarios.adverse и pilot"
    deps: [f02_scorecard_baseline, f03_metric_definitions, f07_unknown_dev_rate_rub, f08_priority_assumption_with_threshold, f09_channel_and_activation_assumptions]

  f11_year3_scaling_forecast:
    kind: forecast
    text: |
      Сценарный ориентир конца 3-го года при условии подтверждения годового удержания номеров на когортах 1-го года: доведение подключённой базы до 25 000 семейных групп (25,0% от доступных 100 000 домохозяйств при не менее 17 500 активных групп в месяц) и 6 000 владельцев нескольких собственных номеров (15,0% от доступных 40 000 владельцев без двойного счёта). Расширение самих знаменателей 100 000 и 40 000 возможно только при отдельном коммерческом решении о допуске младших и архивных тарифов после проверки отсутствия каннибализации ARPU.
    deps: [f01_market_and_dedup, f10_profit_bridge_and_capex_inference]

options:
  opt_keep:
    title: "Сохранить текущее реактивное обслуживание без изменений"
    type: keep
    case: |
      Не требует выделения дизайнера, аналитика, 3,0 чел.-мес. разработки в Q2 и новых прямых расходов на сервисные уведомления; сохраняет инерционный рост семейных групп с 6 500 до 8 000 и валовой прибыли с 275 до 279 млн руб.
    objection: |
      Гарантированно не выполняет ни одну из пяти годовых целей брифа: недобор 6,00 млн руб. валовой прибыли (279 против 285 млн руб.), 3 000 активных и 4 000 подключённых семейных групп, 1 000 владельцев нескольких номеров и 15 п.п. по 14-дневной активации Q4 (45% против 60%).
    deps: [f02_scorecard_baseline, f04_current_capabilities_and_roles]

  opt_lean_deeplink:
    title: "Бережливое пороговое уведомление со ссылкой deep-link на существующий экран передачи ГБ"
    type: change
    case: |
      Требует около 1,5 чел.-мес. разработки в Q2 без создания нового экрана управления группой: отправляет организатору своевременный сигнал со ссылкой на уже работающую в личном кабинете операцию выделения интернета, что позволяет быстро проверить реакцию клиентов при дефиците разработчиков и используется как рукав сравнения B в пилоте.
    objection: |
      Не устраняет потерю 55% групп на неотвеченных приглашениях, не добавляет прозрачный статус pending с защитой от повторного нажатия при задержке биллинга и не переносится на контроль списаний по собственным роутерам, из-за чего не закрывает годовые цели по валовой прибыли (285 млн руб.), активации Q4 (60%) и второму сегменту (2 000 владельцев).
    deps: [f02_scorecard_baseline, f04_current_capabilities_and_roles, f08_priority_assumption_with_threshold, f10_profit_bridge_and_capex_inference]

  opt_phased_shield:
    title: "Ступенчатый запуск: проактивная защита связи семейных групп (Q2) и переиспользование движка для собственных номеров (H2)"
    type: change
    case: |
      Снимает корневой барьер внезапных блокировок интернета и потерь на приглашениях в ядре из 100 000 доступных домохозяйств, проверяет надбавку нового идемпотентного экрана (со статусом pending и раздельными согласиями) против бережливого deep-link в кластерном пилоте Q2, а во 2-м полугодии переиспользует тот же бэкенд пороговых уведомлений без шага приглашения для 40 000 владельцев собственных номеров, закрывая все 5 целей в основном сценарии (285,59 млн руб., 12 200 семей, 8 296 активных, 2 050 мульти-SIM, 62,0% активации Q4).
    objection: |
      Чувствителен к предстартовой готовности биллинга, неподтверждённому 1,0 чел.-мес. тестирования и неизвестной рублёвой ставке человеко-месяца: в неблагоприятном сценарии (сдвиг старта на 1 мес. и перенос мульти-SIM на 2-й год) валовая прибыль останавливается на 281,59 млн руб. (-3,41 млн руб. к цели), а при ставке свыше 659 тыс. руб./чел.-мес. окупаемость CAPEX выходит за пределы планового года.
    deps: [f01_market_and_dedup, f02_scorecard_baseline, f03_metric_definitions, f05_team_and_governance_constraints, f08_priority_assumption_with_threshold, f09_channel_and_activation_assumptions, f10_profit_bridge_and_capex_inference, f11_year3_scaling_forecast]

  opt_close_freeze:
    title: "Отказаться от инвестиций в доработку семейного кабинета и перенаправить ресурс разработки"
    type: close
    case: |
      Защищает операторский бюджет разработки от невозвратного CAPEX, если аудит логов Q1 покажет редкую встречаемость управляемых перебоев (менее 100 подходящих групп в неделю) либо если финансовая ставка 1 чел.-мес. сделает окупаемость недостижимой даже на двухлетнем горизонте.
    objection: |
      Консервирует деградацию метрик направления после слабого базового года (275 млн руб. при плане 282 млн руб.) и лишает оператора инструмента удержания многономерных семей и вторых устройств в собственной базе.
    deps: [f02_scorecard_baseline, f05_team_and_governance_constraints, f06_unknown_incident_and_channel_data, f07_unknown_dev_rate_rub]

strategy:
  product:
    text: |
      1) Целевой сегмент первого этапа (Q1-Q2) — семейные группы на совместимых тарифах с общим пакетом интернета (доступная база 100 000 домохозяйств; подключено 6 500). В MVP входят: пороговый триггер низкого остатка доли участника при наличии свободного пакета у организатора, гранулярные согласия участника с мгновенным отзывом (отдельно на остаток интернета, отдельно на начисления), карточка быстрого выделения ГБ или пополнения счёта плательщиком с явным статусом pending и ключом идемпотентности, а также упрощённое приглашение по ссылке с одним напоминанием через 24-72 часа. Базовая функция бесплатна в рамках совместимого семейного тарифа.
      2) Во 2-м полугодии (только после подтверждения эффекта на гейте Q2) готовый движок пороговых триггеров и статуса pending переиспользуется для второго сегмента — владельцев нескольких собственных номеров (доступная база 40 000 без пересечений с домохозяйствами; подключено 800) без шага приглашения другого человека, с разделением в интерфейсе статуса счёта/трафика SIM роутера и неизвестного оператору состояния питания/батареи устройства.
      3) Осознанные исключения первого запуска: исключаем неподдерживаемые и архивные тарифы без общего пакета, платные партнёрские подписки, геолокацию близких, чтение заряда батареи от прошивок роутеров и бесконтрольное автосписание без волеизъявления плательщика. Экономика опирается на 14 080 доп. оплаченных номер-месяцев внутри планового года по 500 руб. минус 0,45 млн руб. прямых OPEX (+6,59 млн руб. к базе 279 млн руб. -> 285,59 млн руб.).
    deps: [f01_market_and_dedup, f03_metric_definitions, f04_current_capabilities_and_roles, f08_priority_assumption_with_threshold, f10_profit_bridge_and_capex_inference]

  communication:
    text: |
      Ценностное предложение строится вокруг своевременного предупреждения и управляемого действия без безусловных обещаний отсутствия перебоев: в рамках совместимых семейных тарифов и при наличии действующего согласия участника на просмотр остатка интернета оператор заранее сообщает организатору о приближении доли близкого к порогу исчерпания и позволяет выделить гигабайты из свободного остатка общего пакета до срабатывания ограничения трафика. В коммуникации и интерфейсе прямо оговариваются условия применимости и границы сервиса: доступ к начислениям закрыт без отдельного согласия участника; участник вправе отозвать разрешение в любой момент; зачисление ГБ или платежа отображается в статусе ожидания до подтверждения системой расчётов; для собственных роутеров оператор не покрывает диагностику питания и заряда батареи самого устройства. Привлечение ведётся через собственные CVM-каналы (контекстные подсказки в приложении, сервисные уведомления, поддержка после обращения) с дедупликацией по первому касанию за 14 дней.
    deps: [f01_market_and_dedup, f04_current_capabilities_and_roles, f06_unknown_incident_and_channel_data, f09_channel_and_activation_assumptions]

  experiment:
    text: |
      В Q2 проводится контролируемый кластерный пилот с рандомизацией целыми семейными группами на совместимых тарифах (единица анализа — группа с первым в Q2 снижением доли участника к порогу при активном согласии и свободном остатке пакета). Расчёт главной метрики (доля групп с сетевым ограничением интернета по исчерпанию объёма в течение 7 дней от события) выполняется строго по принципу ITT, сохраняя в знаменателе не открывших уведомление. Сравниваются контроль (текущее обслуживание), бережливый способ (уведомление + deep-link на существующую передачу ГБ) и новый экран быстрого действия со статусом pending: при потоке 200 уникальных групп в неделю за 6 недель набора + 7 дней наблюдения (49 дней внутри Q2) формируется по 600 групп на рукав парного сравнения для проверки критерия снижения блокировок не менее чем на 5-7 п.п. (с 18% до 11% или ниже) и преимущества нового экрана над deep-link не менее +2,0 п.п. Жёсткие стоп-правила пилота: (1) немедленная остановка пилота руководителем направления при хотя бы 1 случае видимости чужих данных после отзыва согласия; (2) немедленная остановка спорных операций владельцем биллинга при двойном списании денег или двойном вычитании ГБ; (3) блокировка масштабирования при доле операций с неизвестным статусом свыше 1,0% или росте нехватки общего пакета у других участников группы более чем на +2,0 п.п.; (4) пересмотр и отказ от масштабирования на гейте Q2/Q3, если рост использования не даёт прироста оплаченных месяцев со сроком окупаемости CAPEX в пределах норматива финансов.
    deps: [f03_metric_definitions, f05_team_and_governance_constraints, f08_priority_assumption_with_threshold, f10_profit_bridge_and_capex_inference]

methodology:
  jtbd:
    payer_job: "Когда я оплачиваю связь семьи или собственного домашнего роутера, я хочу заранее получить понятный сигнал о риске отключения и в одно подтверждённое действие распределить оплаченный пакет или пополнить счёт, чтобы близкие и домашние устройства не оставались без интернета в нужный момент."
    user_job: "Когда я пользуюсь номером внутри семейной группы, я хочу оставаться на связи без необходимости просить родных о срочной помощи и при этом сам решать, видит ли организатор только остаток интернета или также мои начисления, сохраняя право отозвать доступ в любой момент."
    forces:
      push: "Внезапная блокировка интернета у ребёнка или пожилого родственника при наличии неиспользованных гигабайт в общем пакете семьи, а также тихая остановка домашнего/дачного роутера из-за пропущенной даты списания."
      pull: "Упреждающее оповещение до отключения трафика и быстрое выделение ГБ с честным статусом подтверждения биллинга без лишних звонков и переключений по меню."
      anxiety: "Опасение участника потерять приватность личных расходов и детализации, а у организатора и плательщика — страх двойного списания денег/гигабайт при повторном нажатии или случайного обнуления общего пакета всей семьи."
      habit: "Привычка реагировать только после жалобы в семейном чате, полагаться на банковский автоплатёж (который не распределяет квоту ГБ внутри тарифа) или вручную проверять номера в личном кабинете."
    deps: [f04_current_capabilities_and_roles, f06_unknown_incident_and_channel_data, f08_priority_assumption_with_threshold]

  ost:
    outcome: "Достижение в плановом году не менее 285 млн руб. валовой прибыли (+6 млн руб. к базе без изменений), 12 000 подключённых и 8 000 активных семейных групп, 2 000 владельцев собственных номеров и 60% 14-дневной активации в Q4."
    opportunities:
      - id: opp_timely_family_intervention
        statement: "Дать организатору возможность вмешаться до блокировки интернета у участника без раскрытия лишних персональных сведений."
        deps: [f04_current_capabilities_and_roles, f08_priority_assumption_with_threshold]
        solutions:
          - option_id: opt_phased_shield
            assumption_test: "Аудит логов Q1 (порог >= 200 подходящих групп/нед.) и кластерный ITT-пилот Q2 на снижение 7-дневных блокировок с 18% до <= 11%."
          - option_id: opt_lean_deeplink
            assumption_test: "Сравнение конверсии и 7-дневных блокировок бережливого deep-link против нового экрана со статусом pending (порог оправдания разработки >= 2,0 п.п.)."
          - option_id: opt_keep
            assumption_test: "Контрольная группа пилота Q2 измеряет базовую частоту 7-дневных блокировок и удержания без вмешательства."
      - id: opp_invite_onboarding_14d
        statement: "Сократить потерю более половины созданных семейных групп на шаге неотвеченного приглашения и первого действия в течение 14 дней."
        deps: [f02_scorecard_baseline, f03_metric_definitions, f09_channel_and_activation_assumptions]
        solutions:
          - option_id: opt_phased_shield
            assumption_test: "Проверка в пилоте и Q4-когорте доли активированных за 14 дней со всеми созданными группами в знаменателе (цель >= 60% против 45% без изменений)."
      - id: opp_multi_sim_reuse
        statement: "Защитить владельцев второй SIM-карты (роутер/модем) от пропуска даты списания за счёт переиспользования движка уведомлений без шага приглашения."
        deps: [f01_market_and_dedup, f04_current_capabilities_and_roles, f09_channel_and_activation_assumptions]
        solutions:
          - option_id: opt_phased_shield
            assumption_test: "Запуск во 2-м полугодии после гейта Q2 с проверкой объединения >= 2 собственных номеров и снижения неоплаченных простоев SIM роутера."
          - option_id: opt_close_freeze
            assumption_test: "Если в Q1/Q2 ставка разработки или слабое удержание не окупают CAPEX, расширение замораживается."

  premortem:
    - failure_mode: "Утечка видимости остатка ГБ или начислений участника после отзыва им согласия из-за кэширования в личном кабинете."
      probability: low
      impact: high
      preventability: high
      mitigation: "Обязательная приёмка с ИБ до старта пилота по 3 состояниям согласия и стоп-правило немедленной остановки пилота руководителем направления при единичном инциденте."
      deps: [f04_current_capabilities_and_roles, f05_team_and_governance_constraints]
    - failure_mode: "Двойное списание платежа или двойное вычитание гигабайт из общего пакета при задержке ответа биллинга и повторном нажатии кнопки."
      probability: medium
      impact: high
      preventability: high
      mitigation: "Ключ идемпотентности операции, явный статус pending в UI и немедленная остановка спорных операций владельцем биллинга со сверкой реестра."
      deps: [f04_current_capabilities_and_roles, f06_unknown_incident_and_channel_data]
    - failure_mode: "Неподтверждение 1,0 чел.-мес. специалиста по проверке услуги и задержка API биллинга сдвигают старт пилота и срывают годовые цели (сценарий adverse: 281,59 млн руб.)."
      probability: medium
      impact: high
      preventability: medium
      mitigation: "Фиксация SLA смежников до конца Q1; при отказе в QA — выделение 0,5 чел.-мес. разработки на автотесты отказов, сужение пилота до 1 тарифа и честная развилка по переносу мульти-SIM на гейте Q2."
      deps: [f05_team_and_governance_constraints, f10_profit_bridge_and_capex_inference]
    - failure_mode: "Клиенты охотно перераспределяют бесплатные гигабайты внутри семьи, но это не увеличивает число оплаченных номер-месяцев (эффект удержания близок к нулю)."
      probability: medium
      impact: high
      preventability: medium
      mitigation: "Отслеживание платежей исходных кластеров пилота (включая номера после выхода из группы), отключение платных SMS при слабой конверсии и закрытие дальнейшего CAPEX с финансовой командой."
      deps: [f03_metric_definitions, f07_unknown_dev_rate_rub, f10_profit_bridge_and_capex_inference]

  promise_matrix:
    - promise: "Заранее предупредим организатора о снижении выделенной доли интернета у близкого и поможем добавить гигабайты из свободного общего пакета в несколько нажатий."
      capability: "Серверный триггер порога квоты участника + проверка свободного остатка и совместимости тарифа + идемпотентная операция выделения ГБ со статусом pending."
      proofs: [f04_current_capabilities_and_roles, f08_priority_assumption_with_threshold, f10_profit_bridge_and_capex_inference]
      boundary: "Действует только на совместимых семейных тарифах при активном согласии участника на просмотр остатка интернета, положительном балансе счёта и наличии свободного объёма в пакете; зачисление завершается после подтверждения биллингом."
      channel: "Мобильное приложение оператора (push и карточка группы) и сервисные SMS при недоступности push."
    - promise: "Участник семейной группы сам выбирает, открывать ли только остаток интернета или также сведения о начислениях, и может закрыть доступ в любой момент."
      capability: "Раздельная модель прав доступа (data_quota_view отдельно от charges_view) и синхронная инвалидация токенов чтения при отзыве согласия через приложение или USSD/SMS."
      proofs: [f04_current_capabilities_and_roles, f05_team_and_governance_constraints]
      boundary: "До принятия приглашения и сразу после отзыва согласия организатор не видит никаких данных по номеру участника; согласие на начисления не включено по умолчанию."
      channel: "Экран приглашения, настройки приватности номера в личном кабинете и бесплатная USSD/SMS-команда."
    - promise: "Владелец роутера или второго собственного устройства получит напоминание на основной смартфон перед списанием платы и отличит неоплату номера от выключенного устройства."
      capability: "Переиспользование движка пороговых уведомлений во 2-м полугодии для объединённых собственных номеров без шага приглашения с выводом статуса счёта и сетевых ограничений SIM."
      proofs: [f01_market_and_dedup, f04_current_capabilities_and_roles, f09_channel_and_activation_assumptions]
      boundary: "Оператор показывает только состояние счёта, пакета и регистрации SIM в сети; заряд батареи и питание роутера оператору неизвестны без телеметрии самого устройства."
      channel: "Личный кабинет мульти-SIM владельца и push/SMS-уведомления на основной контактный номер."

actions:
  - id: act_q1_logs_and_ux
    owner: "Аналитик (0,5 ставки) и Дизайнер (0,5 ставки)"
    due: "2027-03-15"
    task: "Выгрузить 6-месячные логи порогов квоты, списаний и дедуплицированных обращений (окно 72 ч), провести 12-15 интервью и контрбалансированный UX-тест (AB/BA) прототипа."
    trigger: "Если поток уникальных подходящих семей ниже 100 в неделю или свыше 60% сбоев вызваны неоплатой счёта/списаниями — сменить приоритет MVP Q2 на контроль платежей."
  - id: act_q1_dependencies_and_gate
    owner: "Руководитель направления, владелец биллинга, команды ЛК/ИБ и поддержки"
    due: "2027-03-31"
    task: "Подтвердить SLA обновления остатков, API идемпотентности (pending/completed), раздельную проверку 3 состояний согласия, регламент поддержки, ставку 1 чел.-мес. в рублях и решение по 1,0 чел.-мес. QA на гейте Q1."
    trigger: "При неготовности мгновенного отзыва согласий заблокировать раскрытие чужих остатков; при неподтверждении QA — сузить пилот до 1 тарифа и перевести 0,5 чел.-мес. разработки на автотесты отказов."
  - id: act_q2_cluster_pilot
    owner: "Руководитель направления, Разработка (3,0 чел.-мес.) и QA (1,0 чел.-мес.)"
    due: "2027-06-25"
    task: "Провести 49-дневный кластерный ITT-пилот целыми семейными группами (6 недель набора по 200 групп/нед. + 7 дней наблюдения): контроль против бережливого deep-link и нового экрана со статусом pending."
    trigger: "Немедленный стоп при видимости данных после отзыва согласия или двойном списании; на гейте Q2 с финансами остановить тираж нового экрана, если его выигрыш над deep-link ниже 2,0 п.п. или не окупает CAPEX."
  - id: act_h2_scale_and_multisim
    owner: "Руководитель направления, CVM и Финансовая команда"
    due: "2027-12-31"
    task: "Масштабировать проверенное решение на семейную базу в Q3, с августа раскатать переиспользуемый движок на владельцев собственных номеров без шага приглашения, сохранив 10% holdout, и подвести итог Q4-активации через 14 дней после конца года."
    trigger: "При отсутствии прироста оплаченных месяцев в когортах Q2-Q3 относительно контроля отключить платный SMS-канал и заморозить дальнейший CAPEX 2-го полугодия."

brief_plan:
  lead:
    first_customers: "Первая очередь (Q1–Q2) — семейные группы на совместимых тарифах с общим пакетом интернета: доступная оператору база 100 000 домохозяйств из 300 000 на рынке (на начало планового года подключено 6 500 групп; клиенты с несколькими своими SIM, живущие в домохозяйстве, уже учтены только здесь без двойного счёта). Вторая очередь (H2, с 8-го месяца на переиспользуемом движке) — владельцы нескольких собственных номеров (смартфон + роутер/модем): доступная база 40 000 из 180 000 (на начало года подключено 800)."
    problem: "Организатор семейной группы узнаёт об исчерпании выделенной доли интернета у близкого (ребёнка, пожилого родственника) постфактум — из звонка или жалобы, когда доступ к сети уже ограничен, хотя в общем пакете семьи остаётся свободный трафик; параллельно более половины создаваемых групп теряются на шаге неотвеченного приглашения и не доходят до первого действия за 14 дней (42% в базовом году при плане 50%). У владельцев роутеров вторая SIM-карта молча уходит в финансовую блокировку из-за пропуска даты очередного списания."
    offer: "Проактивная защита связи в рамках совместимых семейных тарифов (без абонентской доплаты за саму функцию управления): упреждающий сигнал организатору при снижении доли участника к порогу (строго при наличии отдельного отзываемого согласия участника на видимость остатка ГБ; доступ к начислениям запрашивается отдельно), выделение ГБ из свободного пакета или подтверждение оплаты плательщиком в 1 экран с честным статусом pending и защитой от двойного списания, упрощённое приглашение с напоминанием; во 2-м полугодии — переиспользование движка для своих номеров без шага приглашения с явным отделением статуса счёта SIM от неизвестного оператору заряда роутера."
    expected_result: "Для клиента (допущение пилота до замера в Q1) — снижение доли семейных групп с 7-дневным ограничением интернета после порога низкого остатка с 18,0% до 11,0% (-7,0 п.п., или -38,89% относительно контроля по ITT). Для оператора в основном сценарии планового года — валовая прибыль 285,59 млн руб. (+6,59 млн руб. к прогнозу без изменений 279 млн руб. при цели >= 285 млн руб.: 14 080 доп. оплаченных номер-месяцев по 500 руб. минус 0,45 млн руб. новых прямых OPEX, плюс 9,21 млн руб. переходящего эффекта в годы 2–3), 12 200 подключённых и 8 296 активных семейных групп, 2 050 владельцев нескольких номеров и 62,0% 14-дневной активации Q4; отдельный CAPEX 10,0 чел.-мес. окупается внутри планового года при ставке до 659 000 руб./чел.-мес."
    q1_decision: "К концу Q1 (после выгрузки 6-месячных логов биллинга/сети, 12–15 интервью, контрбалансированного UX-теста и подтверждения SLA биллингом, ЛК/ИБ и поддержкой) — одобрить запуск 49-дневного кластерного пилота в Q2 на совместимых семейных тарифах (одна причина — исчерпание доли интернета), выделив по 0,5 ставки дизайнера и аналитика, 3,0 чел.-мес. разработки и подтвердив 1,0 чел.-мес. QA (либо при неподтверждении QA утвердить суженный контур на одном тарифе со сдвигом графика)."
    q2_decision: "К концу Q2 совместно с финансовой командой (по результатам пилота в 3 контурах метрик и фактической рублёвой ставке человеко-месяца) — принять одно из четырёх решений: (1) масштабировать полное решение на семейную базу в Q3 и открыть 2,5 чел.-мес. разработки H2 для выхода на владельцев собственных номеров; (2) тиражировать только бережливое предупреждение с deep-link без нового кабинета, если выигрыш нового экрана к deep-link ниже 2,0 п.п.; (3) продлить наблюдение на 3–4 недели при малом потоке событий; (4) остановить инициативу при нарушении приватности/идемпотентности или отсутствии окупаемого прироста оплаченных месяцев."

  parts:
    - id: part_1
      title: "1. Клиент и его проблема"
      deps: [f01_market_and_dedup, f02_scorecard_baseline, f04_current_capabilities_and_roles, f06_unknown_incident_and_channel_data, f08_priority_assumption_with_threshold]
      body: |
        ### Реконструкция конкретного клиентского случая и точка своевременной помощи
        Конкретные рассказы клиентов и частоты сбоев в брифе не даны (`unknown`: `f06_unknown_incident_and_channel_data`), поэтому ниже восстановлен типовой сценарий на основе зафиксированных в брифе механик семейного тарифа, который в Q1 верифицируется на глубинных интервью и логах оператора:

        1. **Последний момент штатной работы (`T0`, 16:40 буднего дня)**: семейная группа на тарифе с общим пакетом интернета оплачена плательщиком вовремя, у организатора в общем пакете остаётся свободный нераспределённый объём, а участник группы (школьник по дороге с занятий или пожилой родственник в поликлинике) пользуется навигатором и мессенджером, расходуя последние мегабайты выделенной ему индивидуальной доли.
        2. **Последний момент, когда оператор ещё мог помочь вовремя (`T1`, 17:05 — точка невозврата до ущерба)**: выделенная квота участника опускается ниже предупредительного порога за 15–30 минут до нуля. В этот момент у организатора есть и право, и свободный остаток пакета, чтобы добавить гигабайты за 20 секунд, но адресного операционного сигнала с быстрым действием нет.
        3. **Прерывание связи и косвенный сигнал (`T2`, 17:20)**: индивидуальная доля участника исчерпана; сеть включает ограничение передачи данных по квоте. Сообщения и геометка в семейном чате перестают отправляться. Организатор замечает лишь косвенный бытовой симптом — «близкий перестал отвечать в мессенджере».
        4. **Ручной разбор и запоздалое разрешение (`T3`, 17:45–17:55)**: участник дозванивается обычным голосовым вызовом (либо с чужого телефона/Wi-Fi) и просит помочь. Организатор открывает личный кабинет, переключается в раздел группы, выясняет причину и вручную переводит гигабайты из свободного остатка. Доступ восстановлен в 17:55, однако **помощь уже запоздала**: потеряно 35 минут доступа к интернету в чувствительной жизненной ситуации и потрачено время семьи на выяснение причины при полностью оплаченном общем тарифе.

        Для второй группы клиентов — **владельца нескольких собственных номеров** (`SIM` в смартфоне + `SIM` в домашнем или дачном роутере) — критическая развилка наступает в иной момент: **за 24–48 часов до даты ежемесячного списания платы по номеру роутера**, когда денег на балансе второй SIM не хватает, а стандартное SMS-предупреждение приходит в веб-интерфейс самого роутера и остаётся непрочитанным до полной остановки интернета дома.

        ### Разделение наблюдаемого сигнала и истинной причины (диагностическая матрица)
        Ошибочная диагностика разрушает доверие: если посоветовать «добавить гигабайты», когда заблокирован сам счёт или просто разрядилось устройство, действие клиента не восстановит связь. Продукт обязан различать сигнал и сетевую/биллинговую причину:

        | Сегмент и бытовой сигнал | Возможная причина | Какие записи оператора подтверждают версию | Как меняется предлагаемое клиенту действие |
        | --- | --- | --- | --- |
        | **Семья**: близкий не отвечает в мессенджере / жалуется, что не грузятся сайты | **А. Исчерпана выделенная доля ГБ** при активном тарифе | Остаток квоты участника `= 0`, сетевой код ограничения по квоте (`quota_limit`), счёт активен, у организатора свободный пакет `> 0` (при наличии согласия на остаток) | Показать организатору карточку быстрого выделения ГБ из свободного остатка общего пакета |
        | **Семья**: нет интернета у участника или всей группы | **Б. Пропущен платёж / финансовая блокировка** | Статус счёта `financial_block`, неуспешная попытка списания абонентской платы, известны сумма и дата платежа | Скрыть недоступную кнопку передачи ГБ; направить **плательщику** запрос на пополнение счёта с точной суммой |
        | **Семья**: близкий не выходит на связь | **В. Устройство вне сети / выключено**, ограничений у оператора нет | Остаток ГБ `> 0`, счёт оплачен, кодов ограничения на номере нет | Не отправлять ложных уведомлений о трафике или оплате |
        | **Собственный роутер**: дома пропал Wi-Fi | **Г. Неоплата или исчерпание пакета на SIM роутера** | Счёт второй SIM в финансовой блокировке либо пакет `= 0` при известной дате/сумме списания | Уведомить владельца на **основной смартфон** и предложить пополнить счёт / пакет SIM роутера |
        | **Собственный роутер**: Wi-Fi не работает, но тариф оплачен | **Д. Роутер выключен из сети или села его батарея** | Счёт SIM активен, трафик `> 0`, ограничений нет; **заряд батареи роутера оператору неизвестен (`unknown`) без данных от самого устройства** | Честно показать: «Номер роутера оплачен и активен, ограничений связи нет — проверьте питание и индикаторы самого устройства» |

        ### Связь проблемы с отставанием базового года и выбор первого приоритета
        В базовом году направление недовыполнило план сразу по всем контурам (`fact`: `f02_scorecard_baseline`): валовая прибыль составила `275 млн руб.` против плана `282 млн руб.` (`-7 млн руб.`), подключённые семейные группы — `6 500` против `7 500` (`-1 000`), активные группы за последний месяц — `4 000` против `5 000` (`-1 000`), а 14-дневная активация в Q4 просела до `42%` при плане `50%` (`-8 п.п.`). Поскольку прямая факторная разбивка этого отставания в брифе не дана, фиксируем проверяемую причинно-следственную связь как гипотезу до аудита логов Q1: (1) трение приглашения без понятных границ приватности роняет 14-дневную активацию до `42%`–`45%`, сжимая базу подключённых групп; (2) отсутствие упреждающих сигналов оставляет подключённые группы «спящими» до аварии (`4 000` активных из `6 500`); (3) внезапные отключения интернета у участников и забытых роутеров ускоряют распад групп и прекращение оплаты вторых SIM-карт, отнимая оплаченные номер-месяцы валовой прибыли.

        Почему в 1-м полугодии мы выбираем **семейные группы** (`100 000` доступных домохозяйств) раньше владельцев собственных номеров (`40 000` доступных) и сопоставляем нашу целевую ситуацию (**внезапное исчерпание интернета в семейной группе**) с главной серьёзной альтернативой из брифа (**непонятные списания в семейной группе**, когда связь работает, но семье неясно, за что списали деньги):

        | Критерий сравнения (по брифу) | Проблема №1 (выбранный приоритет): внезапное исчерпание доли интернета у участника семьи | Альтернативная проблема №2: непонятные списания при работающей связи в семье | Вывод для выбора первой очереди |
        | --- | --- | --- | --- |
        | **1. Охват разных клиентов** | Потенциально затрагивает ядро из `100 000` доступных домохозяйств (`6 500` уже подключённых групп, где в каждой минимум 2 номера); механика затем переносится ещё на `40 000` владельцев своих SIM (`unknown` точная доля до логов Q1) | Возникает у подмножества семей и плательщиков с разовыми платными опциями, контент-услугами или выходом за пакет (`unknown` точная доля до логов КЦ Q1) | Охват сопоставим или шире у Проблемы №1 за счёт базового сценария общего пакета и прямого переиспользования движка для мульти-SIM |
        | **2. Повторяемость** | Высокая регулярность: квота трафика расходуется и обнуляется в каждом расчётном месяце (до 12 циклов риска в год на группу) | Эпизодическая: возникает при подключении доп. услуг, смене условий или автопродлении платных опций | Пороговое управление трафиком формирует регулярную ежемесячную привычку (`active_last_month`) |
        | **3. Тяжесть последствий** | **Острая потеря связи в моменте**: близкий остаётся без навигации, мессенджеров и онлайн-сервисов при оплаченном семейном тарифе | Финансовое раздражение, недоверие к счёту и нагрузка на поддержку, но **связь в момент обнаружения продолжает работать** | Предотвращение фактического обрыва связи у зависимого близкого защищает базовую ценность семейного тарифа |
        | **4. Доля случаев, где возможна помощь вовремя** | **Высокая превентивность**: оператор видит снижение остатка квоты в реальном времени *до* блокировки и даёт бесплатный инструмент решения внутри тарифа (выделить ГБ из остатка) при базовом согласии на остаток | **Низкая превентивность**: вопрос обычно возникает *после* свершившегося списания; кроме того, показ организатору детализации чужих платных услуг требует отдельного чувствительного согласия на начисления, в котором участники чаще отказывают | В Проблеме №1 оператор предотвращает сам инцидент до ущерба, не требуя раскрытия финансовых списаний участника |

        ### Какие данные собрать в Q1 и как отделить повторные обращения от новых случаев
        Чтобы не строить решение вслепую, за первые 6 недель Q1 аналитик и дизайнер собирают три контура сведений за расчётное окно **6 последних полных календарных месяцев**:
        1. **Качественные интервью (`12–15` бесед)**: организаторы семейных групп, участники (включая отказавшихся от приглашения) и плательщики, не являющиеся организаторами, плюс владельцы роутеров. Выясняем: какой сигнал заметили первым, что плательщик заранее знал о дате и сумме списания, почему не приняли приглашение и какие данные готовы открыть близкому.
        2. **Обращения в поддержку с жёсткой дедупликацией повторов**: выгружаем звонки и чаты по тематикам «нет интернета в группе», «не прошла передача ГБ», «непонятное списание». **Правило отделения повторных звонков от уникальных случаев**: все обращения одного номера или участников одной семейной группы по одной корневой причине внутри скользящего окна **72 часов** схлопываются в **один уникальный инцидент** (с отдельным счётчиком `repeat_calls_per_incident`). Это не позволяет громкому сегменту с 3–4 повторными звонками по одному списанию исказить реальную распространённость проблемы по числу разных семей.
        3. **Данные о «молчащих» клиентах (логи сети и биллинга без обращения в поддержку)**: по всем `6 500` подключённым семейным группам и `800` владельцам собственных номеров считаем долю уникальных групп/владельцев в месяц, у которых фиксировался `quota_limit` или `financial_block` (включая тех, кто молча переждал блокировку до конца месяца или переключился на SIM конкурента, не позвонив оператору).

        ### Проверяемое допущение и порог смены приоритета
        - **Принятое для расчёта допущение (`assumption`: `f08_priority_assumption_with_threshold`)**: в подключённой семейной базе не менее `25%` групп за квартал проходят через снижение выделенной доли участника к критическому порогу при наличии свободного остатка общего пакета у организатора (что даёт поток не менее **`200` впервые подходящих уникальных групп в неделю** в Q2), а своевременный сигнал с быстрым выделением ГБ снижает долю групп с 7-дневным ограничением интернета в этой когорте с **`18,0%`** до **`11,0%`** (обоснованный рабочий диапазон ожидания в тесте: **`10,0%–13,0%`**, т.е. снижение на `5,0–8,0 п.п.`).
        - **Условие и порог смены приоритета**: если ретроспективная выгрузка логов Q1 за 6 месяцев покажет, что поток уникальных подходящих семейных групп ниже **`100` групп в неделю** ИЛИ свыше **`60%`** отключений и распадов семейных групп происходят при ненулевом пакете ГБ из-за просрочки оплаты общего счёта и конфликтов вокруг непонятных списаний, команда **до старта разработки Q2** меняет первый сценарий MVP с перераспределения ГБ на упреждающее уведомление плательщика о сумме/сроке очередного списания и прозрачную карточку начислений.

    - id: part_2
      title: "2. Предложение и путь к клиенту"
      deps: [f01_market_and_dedup, f02_scorecard_baseline, f03_metric_definitions, f04_current_capabilities_and_roles, f09_channel_and_activation_assumptions]
      body: |
        ### Обещание клиенту, тарифные границы и гранулярные согласия
        **Формулировка обещания**: на совместимых семейных тарифах с общим пакетом интернета оператор заранее предупредит организатора, когда выделенная доля участника приближается к исчерпанию (при наличии действующего согласия участника на просмотр остатка интернета), и позволит добавить гигабайты из свободного пакета семьи или направить запрос плательщику до прекращения доступа к интернету, честно отображая ход подтверждения операции в системе расчётов.

        **Условия выполнения и раздельная матрица согласий**:
        - Разрешение **`data_quota_view` (остаток интернета)** открывает организатору *исключительно* текущий остаток выделенной участнику доли ГБ и факт достижения предупредительного порога (напр., `< 500 МБ` или `< 10%` доли). Оно **не открывает** историю посещённых сайтов, геолокацию, список звонков, баланс личного кошелька и детализацию платных услуг.
        - Разрешение **`charges_view` (сведения о начислениях)** запрашивается отдельным независимым переключателем (по умолчанию выключено): без него организатор не видит структуру начислений участника, но может беспрепятственно помогать ему с интернетом из общего пакета.

        ### Сквозной путь ролей: организатор, участник, плательщик и владелец собственных номеров
        Поскольку организатор, участник и плательщик могут быть тремя разными людьми (например: взрослая дочь — организатор группы, пожилая мама — участник и владелец номера, супруг — плательщик по привязанной карте), путь разводит их права и экраны:

        1. **Приглашение и крайние состояния согласия в семейной группе**:
           - *Отправка*: организатор вводит номер близкого и выбирает стартовую долю ГБ; система сразу проверяет совместимость тарифа и отправляет участнику push/SMS со ссылкой, где крупно указаны имя/номер пригласившего и два раздельных пункта согласия (`остаток интернета` — обязательно для автопомощи по трафику; `начисления` — опционально).
           - *Приглашение без ответа*: группа создаётся в статусе `invited_pending`; организатор видит только статус «Ожидает ответа до [дата]», **никакие данные о номере приглашённого не отображаются**. Через 24–72 часа уходит ровно одно сервисное напоминание; через 14 дней неакцептованное приглашение истекает (при этом созданная группа остаётся в знаменателе метрики 14-дневной активации!).
           - *Отказ участника*: статус `declined`, организатор получает нейтральное уведомление без раскрытия данных номера; повторная отправка приглашения тому же номеру блокируется антиспам-паузой.
           - *Отзыв согласия в любой момент*: участник одной кнопкой в приложении или бесплатной USSD/SMS-командой (работающей даже при нулевом интернете) отзывает `data_quota_view` и/или `charges_view`. Токены чтения инвалидируются синхронно: карточка участника у организатора мгновенно переходит в закрытый вид без остатков и пороговых уведомлений.
        2. **Путь владельца нескольких собственных номеров (`SIM` смартфона + `SIM` роутера, 2-е полугодие)**:
           - Шаг приглашения другого человека и ожидания внешнего согласия **полностью убран**: оба номера оформлены на одного владельца в едином профиле. Владелец в 2 нажатия связывает номер роутера с основным смартфоном и включает напоминание за 2 дня до даты списания и при остатке трафика `< 10%`. На карточке роутера разведены два блока: «Связь и счёт SIM у оператора» (точные данные биллинга/сети) и «Устройство» (честная сноска: уровень заряда и питание роутера оператору неизвестны без данных от самого устройства).

        ### Разбор одной операции до конца: проверки, статус `pending` и идемпотентность
        Разберём целевую операцию **выделения интернета участнику** (и зеркальную операцию **подтверждения оплаты плательщиком**):
        1. **Предварительные проверки до активации кнопки**: система синхронно проверяет 4 условия: (а) тариф группы разрешает распределение пакета; (б) текущий пользователь имеет роль организатора; (в) согласие участника `data_quota_view` активно; (г) свободный нераспределённый остаток общего пакета не меньше выбранного объёма (напр., `+2 ГБ`). Если действие касается пополнения счёта — сначала на экране фиксируются точный номер зачисления и сумма в рублях, а кнопка списания доступна только подтверждённому **плательщику**.
        2. **Фиксация намерения и ключ идемпотентности**: при нажатии «Выделить 2 ГБ номеру +7…» клиентское приложение передаёт серверу уникальный `idempotency_key` (привязанный к паре `group_id + target_msisdn + threshold_event_id` на окно 15 минут).
        3. **Промежуточное состояние `pending` (до ответа системы расчётов)**: пока биллинг не прислал финальное подтверждение, интерфейс **не пишет** «Интернет уже добавлен». Клиент видит честный экран `В обработке (ожидаем подтверждения системы расчётов)` с указанием: кому (`Мама, +7…`), сколько (`2 ГБ из свободного остатка`), во сколько отправлен запрос и ссылкой **«Проверить итог в журнале операций группы»**. Кнопка повторной отправки с тем же ключом заблокирована спиннером; если из-за обрыва сети запрос уходит повторно, сервер распознаёт `idempotency_key` и возвращает статус уже созданной операции, **исключая двойное вычитание гигабайт из общего пакета и двойное списание денег**.
        4. **Завершение и подтверждение решения проблемы**: после ответа биллинга (`completed`) статус в журнале меняется на «Исполнено: выделено 2 ГБ, новый доступный остаток участника — 2,3 ГБ», а участник и организатор получают подтверждающий push/SMS. При техническом отказе (`failed` или таймаут) резерв возвращается, а экран объясняет причину (например, «Общий счёт группы перешёл в блокировку — требуется пополнение плательщиком»).

        ### Почему клиент выберет этот способ: сравнение с привычными альтернативами и состав MVP

        | Привычный способ клиента | Что он делает сегодня | Где возникает сбой или лишнее трение | Конкретное преимущество нашего решения |
        | --- | --- | --- | --- |
        | **Семейный чат / звонок близкого** | Участник сам пишет или звонит, когда интернет пропал | Сообщение в мессенджер не уходит при уже заблокированном трафике; помощь происходит *после* потери связи | Вмешательство переносится на `15–30 минут` **раньше** — до блокировки интернета; исчезает шаг вынужденной просьбы близкого |
        | **Банковский автоплатёж** | Пополняет рублёвый счёт по расписанию или порогу | Банк подтверждает списание денег, но **не распределяет гигабайты** внутри оплаченного семейного пакета; при ошибке номера перевод уходит не туда | Зачисление и снятие ограничения проверяются непосредственно в биллинге оператора; решается задача квоты ГБ без лишних трат |
        | **Ручная проверка ЛК / веб-админка роутера** | Организатор или владелец сам заходит проверять остатки по номерам | Требует держать даты в голове; SMS на SIM роутера никто не открывает | Сигнал приходит проактивно на основной смартфон именно тогда, когда требуется действие |

        **Состав первого запуска (MVP Q2) и модель монетизации**:
        - *Уже есть у оператора*: совместимые семейные тарифы с общим пакетом, базовая функция ручного выделения ГБ в ЛК, переключение между своими номерами, сетевые/биллинговые события остатков.
        - *Добавляем к пилоту Q2*: триггер порога доли участника при наличии свободного пакета у организатора, раздельные согласия с мгновенным отзывом, экран быстрого действия со статусом `pending` и `idempotency_key`, журнал статуса операций, быстрое приглашение с 1 напоминанием.
        - *Без чего обходимся на проверке Q2*: без платной подписки, без партнёрских сервисов, без геолокации (требующей отдельного спецсогласия), без интеграции с прошивками роутеров для показа батареи, без безусловного автоперераспределения ГБ без подтверждения человека.
        - *Что бесплатно, а за что платят отдельно*: уведомления, онбординг и распределение уже оплаченного общего пакета **входят в семейный тариф бесплатно** (окупаются удержанием номеров). Отдельно оплачиваются только докупка дополнительного пакета трафика сверх тарифа (при исчерпании всего общего пакета семьи) и самостоятельные опции безопасности (защита от спам-звонков / детского контента — вне MVP).
        - *Проверка удобства до разработки (контрбалансированный дизайн `AB / BA`)*: в Q1 на 16–20 респондентах даём решить одинаковую задачу («узнать причину риска отключения и выделить 2 ГБ с проверкой статуса») в текущем ЛК (`A`) и новом прототипе (`B`). Половина участников проходит порядок `A -> B`, вторая половина — `B -> A`, чтобы убрать эффект научения при сравнении времени. Фиксируем долю прохождения без подсказки модератора, ошибки трактовки статуса `pending` / границ согласия и медианное время действия.
        - *Переиспользование для владельцев собственных номеров в H2*: переиспользуются движок пороговых триггеров, экран `pending` + идемпотентность оплаты и журнал операций; выбрасывается шаг приглашения/чужих согласий; **заново проверяются** оптимальный срок предупреждения до списания по роутеру (`24` vs `48` часов), маршрутизация уведомления строго на основной номер владельца и ясность подсказки про питание роутера.

        ### Привлечение клиентов, сведение базы без двойного счёта и декомпозиция активности (расчёт у решения)
        Доля охвата считается строго от доступной оператору базы без пересечений (`100 000` домохозяйств и `40 000` владельцев собственных номеров, `fact`: `f01_market_and_dedup`). Поскольку разбивка по каналам в брифе не дана, подписываем сценарные допущения (`assumption`: `f09_channel_and_activation_assumptions`) и задаём правило исключения двойного счёта: **подключение атрибутируется ровно одному каналу по первому целевому касанию в окне 14 дней** (`приоритет: 1. Контекстный триггер в приложении -> 2. CVM push/SMS и клиентское приглашение -> 3. Служба поддержки и розница`). Если клиент увидел подсказку в приложении, а завершил настройку после звонка в поддержку, он учитывается один раз за приложением с пометкой ассистированной конверсии поддержки.

        | Канал привлечения (основной сценарий, семьи) | Момент уместного показа | Уникальный охват подходящих домохозяйств (допущение) | Конверсия в созданную группу | Создано групп | Приняли приглашение и удерживаются на конец года (вклад сверх «без изменений») | Прямые затраты канала и инкрементальный CAC |
        | --- | --- | ---: | ---: | ---: | ---: | ---: |
        | **1. Приложение (in-app триггер)** | Просмотр баланса/докуп трафика на совместимом тарифе с `>= 2` номерами | `28 000` | `10,0%` | `2 800` | `+1 950` новых групп | `0 руб.` (собственный интерфейс) |
        | **2. CVM-сообщения и рекомендации** | Превышение лимита на втором номере семьи; шеринг ссылки приглашения | `22 000` | `6,5%` | `1 430` | `+950` новых групп | `252 000 руб.` (сервисные SMS) |
        | **3. Поддержка и продажи (после инцидента)** | Обращение по поводу нехватки ГБ или настройки тарифа близкому | `10 000` | `6,0%` | `600` | `+400` новых групп | `0 руб.` доп. бюджета (в штатной смене) |
        | **Снижение оттока уже подключённых групп** | Упреждающая защита от блокировок интернета в существующей базе | база `6 500–8 000` | — | — | **`+900` сохранённых групп** | входит в сервисные уведомления |
        | **Итого инкремент к «без изменений» (`main`)** | Дедуплицировано по первому касанию (`60 000` из `100 000` доступных) | **`60 000`** | — | `4 830` | **`+4 200` групп** (`3 300 + 900`) | **`252 000 руб.` (`60,0 руб.` / доп. группу)** |

        **Полное сведение баланса подключённых баз на конец планового года (`ledger brief-calc`)**:
        - **Семейные группы** (рынок `300 000`, доступная база `100 000`): старт года `6 500` (`6,5%` доступной базы) + чистый органический прирост без изменений `+1 500` (`= 8 000`, или `8,0%`) + инкрементальные новые подключения `+3 300` + спасённые от распада группы `+900` (`+4 200` сверх прогноза без изменений) = **`12 200` подключённых групп** (`12,20%` от `100 000`, цель `>= 12 000` выполнена с запасом `+200`; в неблагоприятном сценарии: `8 000 + 1 900 + 500 = 10 400`, охват `10,40%`, разрыв `-1 600`). Мы не приписываем инициативе органические `+1 500` групп и делим `252 000 руб.` затрат строго на инкремент `4 200` (`60 руб./группу`).
        - **Владельцы нескольких собственных номеров** (рынок `180 000`, доступная база `40 000` без пересечений): старт года `800` (`2,0%`) + органика без изменений `+200` (`= 1 000`, или `2,5%`) + запуск переиспользуемого движка с августа без шага приглашения в основном сценарии (`+880` новых объединивших `>= 2` своих номеров + `170` сохранённых = `+1 050` при прямых SMS-затратах `42 000 руб.`, или `40 руб./владельца`) = **`2 050` подключённых владельцев** (`5,12%` от `40 000`, цель `>= 2 000` выполнена). В неблагоприятном сценарии сегмент переносится на 2-й год: сохраняется прогноз без изменений **`1 000` владельцев** (`2,50%`, разрыв `-1 000`).
        - **Воронка 14-дневной активации в Q4 (строго со всеми созданными группами в знаменателе)**: в основном сценарии в Q4 создаётся `2 000` групп -> приглашение принимают `1 560` (`78,0%`), а **`440` групп (`22,0%`) остаются без ответа или с отказом и сохраняются в знаменателе** -> первое целевое действие за 14 дней от создания группы выполняют `1 240` групп -> активация равна **`1 240 / 2 000 = 62,0%`** (`95% ДИ Вильсона [59,85%; 64,10%]`, цель `>= 60%` выполнена; итог подводится 15 января, когда пройдут полные 14 дней для групп, созданных 31 декабря). Исключение неотвеченных приглашений дало бы ложные `1 240 / 1 560 = 79,49%` — такой расчёт запрещён правилами брифа. Точки возможной остановки клиента (спам-настороженность приглашённого и забывание совершить первое действие после акцепта) снимаются прозрачным экраном раздельного согласия, 1 напоминанием через 24–72 часа и мгновенным показом остатка пакета сразу после входа участника.

        **Декомпозиция активных семейных групп за последний месяц года (`5 000 -> >= 8 000`)**:
        - В сценарии «без изменений» активны `5 000` из `8 000` подключённых групп (`62,50%`). При ровно `12 000` подключённых групп сохранение старой доли `62,50%` даёт `7 500` активных групп (`+2 500` за счёт масштаба базы, т.е. `83,3%` нужного прироста), а для достижения `8 000` активных долю вовлечённости нужно поднять до двух третей (`66,67%`, ещё `+500` групп).
        - В основном сценарии команды (`12 200` подключённых групп и доля активных `68,0%`, `+5,5 п.п.` за счёт адресных пороговых уведомлений в нужный момент) прогноз составляет **`8 296` активных групп** (`+3 296` к прогнозу без изменений), где **`+2 625` групп** даёт рост числа подключённых семей (`4 200 * 0,625`) и **`+671` группу** даёт рост доли активных (`12 200 * (0,68 - 0,625)`).
        - *Методическая защита для автоматического режима*: если на следующих этапах добавляется автоправило пополнения доли интернета, которое срабатывает само и избавляет организатора от лишних ручных заходов в кабинет, формальная метрика ручных просмотров может снижаться при росте реальной пользы. Поэтому клиентскую пользу мы в обязательном порядке измеряем отдельно по отсутствию сетевых ограничений трафика (`quota_limit`), а в продуктовой аналитике учитываем успешное автоматическое выделение ГБ отдельно от ручных открытий экрана.

    - id: part_3
      title: "3. Польза для клиента и прибыль оператора"
      deps: [f02_scorecard_baseline, f03_metric_definitions, f05_team_and_governance_constraints, f07_unknown_dev_rate_rub, f08_priority_assumption_with_threshold, f10_profit_bridge_and_capex_inference]
      body: |
        ### Система трёх контуров метрик проверки и учёт неизвестных статусов
        Главный клиентский результат первого запуска — **сохранение непрерывного доступа к интернету у участника семейной группы после снижения его выделенной доли к критическому порогу**. Факт открытия push-уведомления не доказывает пользу: опираемся на объективные сетевые записи об ограничении доступа.

        | Контур измерения | Показатель и единица счёта | Точный числитель и знаменатель (формула воспроизводимости) | Окно, источник данных и правило для неизвестных статусов |
        | --- | --- | --- | --- |
        | **1. Польза для клиента (главная метрика решения)** | Доля подходящих семейных групп с ограничением интернета по квоте в течение 7 дней *(единица: семейная группа — кластер)* | **Числитель**: группы из знаменателя, где хотя бы на одном подходящем номере участника за 168 часов от первого события зафиксирован сетевой статус `quota_limit`. **Знаменатель (`ITT`)**: все рандомизированные в рукав группы, где впервые в Q2 наступило подходящее событие низкого остатка (**включая не открывших push/SMS и не нажавших кнопку**) | 7 полных суток (168 ч) от первого в Q2 события; логи PCRF/биллинга одинаково пишутся в контроле и тесте |
        | **2. Работа услуги (техническое качество)** | Доля подтверждённых клиентом операций, исполненных биллингом верно и в срок *(единица: подтверждённая операция)* | **Числитель**: операции со статусом `completed`, верным объёмом ГБ/руб. и временем ответа `<= 60 с`. **Знаменатель**: все подтверждённые организатором/плательщиком запросы с уникальным `idempotency_key` | Журнал оркестратора и биллинга. **Случаи с неизвестным итогом (`unknown_status` / таймаут сверки)** выделяются отдельной строкой и в консервативной проверке приравниваются к неуспеху; при доле `> 1,0%` раскатка блокируется |
        | **3. Нежелательные последствия (стоп-метрики)** | (а) Видимость чужих данных после отзыва согласия; (б) Двойные списания денег/ГБ; (в) Исчерпание общего пакета у других членов семьи; (г) Ложные тревоги | (а) Число чтений после `revoke` (`норма = 0`); (б) Число дублей списаний по одному событию (`норма = 0`); (в) Доля групп, где за 7 дней обнулился весь общий пакет организатора (контроль разницы с группой `A` `<= +2,0 п.п.`); (г) Доля сигналов при заблокированном счёте или нулевом общем пакете | Ежедневный автоаудит ИБ и сверка реестра биллинга; мгновенные стоп-правила на операцию или весь пилот |

        ### Пробный запуск (пилот Q2): кластерная рандомизация, `ITT`, п.п. против % и проверка темпа набора
        1. **Условия включения и старт наблюдения**: до распределения в расчёт допускаются группы, где одновременно выполнены 4 условия, одинаково регистрируемые в логах и для теста, и для контроля: совместимый семейный тариф с общим пакетом, действующее согласие участника на видимость остатка, свободный нераспределённый пакет у организатора (`>= минимального шага передачи`) и **первый в Q2 выход доли участника на порог низкого остатка** (точка старта 7-дневного окна). Повторные срабатывания внутри той же семьи в течение пилота не добавляются как новые независимые единицы в знаменатель главной метрики.
        2. **Кластерное распределение и зачем нужен третий (бережливый) рукав**: участники одной семьи делят общий пакет (выделение 2 ГБ ребёнку уменьшает остаток родителя), поэтому рандомизация проводится **строго целыми семейными группами** (а во 2-м полугодии для мульти-SIM — целыми владельцами). Чтобы не просто доказать пользу относительно статус-кво (`A` — текущее обслуживание), но и **экономически оправдать разработку нового экрана**, сопоставляем три варианта: `A` (контроль без изменений), `B` (**бережливый способ**: своевременное предупреждение со ссылкой `deep-link` на уже существующую в ЛК страницу передачи ГБ) и `C` (целевой экран быстрого действия со статусом `pending` и идемпотентностью). Переход к полному тиражу `C` оправдан, если `C` снижает 7-дневные блокировки не менее чем на `5,0–7,0 п.п.` к `A` **и** выигрывает у бережливого `B` не менее **`2,0 п.п.`** по снижению блокировок либо **`>= 10 п.п.`** по доле успешно завершённых передач ГБ.
        3. **Различие процентных пунктов (п.п.) и относительных процентов (%) + расчёт мощности и сроков Q2 (`ledger brief-calc`)**:
           - *Разбор иллюстративного примера брифа*: снижение доли ограничений с `12,0%` до `9,0%` равно **`-3,0 п.п.`** абсолютно и **`-25,0%`** относительно исходных `12,0%`. Однако если набрать за 6 недель по 100 групп в неделю (`600` групп, т.е. по `300` на рукав), 95% доверительные интервалы Вильсона составят `[8,80%; 16,17%]` и `[6,26%; 12,78%]` — интервалы широко перекрываются, и данных для уверенного вывода недостаточно!
           - *Расчёт нашего пилота Q2 в условной когорте риска (`brief_model.pilot`, допущение до логов Q1)*: поскольку в знаменатель входят не все `6 500–7 000` семей подряд, а только группы, уже дошедшие до **порога низкого остатка**, базовая вероятность фактической блокировки за 7 дней в контроле выше средней по базе — закладываем `18,0%` в контроле против целевых `<= 11,0%` в тесте: это абсолютный сдвиг **`-7,0 п.п.`** и относительное снижение на **`-38,89%`**. При потоке **`200` впервые подходящих уникальных групп в неделю** за **`6` недель набора** (`42` дня) в ключевое парное сравнение входит **`1 200` семейных групп** (**по `600` групп на рукав**; для одновременного подключения бережливого рукава `B` при потоке 200–300 групп/нед. выделяется от `400` до `600` групп). При `600` группах на рукав ожидаемые 95% интервалы Вильсона равны **`[15,13%; 21,27%]`** в контроле и **`[8,74%; 13,76%]`** в тесте — **интервалы полностью расходятся** (`13,76% < 15,13%`).
           - *Календарная проверка Q2*: `6 недель набора (42 дня) + 7 дней полного наблюдения за последними участниками = 49 календарных дней`, что уверенно помещается внутри 90-дневного квартала Q2 (оставляя 5 недель в начале Q2 на сборку MVP и 1 неделю в конце Q2 на расчёт решения с финансами). При масштабировании в Q3–Q4 сохраняем 10% контрольную группу (`holdout`) на впервые сработавших группах для проверки устойчивости эффекта на новых тарифах и реальных платежах.

        ### Мост валовой прибыли планового года (`279 -> >= 285 млн руб.`) и отдельный расчёт `CAPEX`
        Исходная точка планового года «без изменений» — **`279,00 млн руб.`**; минимальная цель — **`285,00 млн руб.`**; требуемый чистый прирост валовой прибыли — **`+6,00 млн руб.`** (`fact`: `f02_scorecard_baseline`). По единой учебной ставке **`500 руб.`** валовой прибыли за один дополнительный оплаченный месяц одного номера (`fact`: `f03_metric_definitions`):
        - При `0 руб.` новых прямых расходов (`OPEX`) требуется минимум `6 000 000 / 500 = 12 000` дополнительных оплаченных номер-месяцев внутри планового года.
        - В нашей модели честно заложены новые прямые расходы на сервисные SMS-приглашения, офлайн-оповещения и обработку спорных кейсов: **`0,45 млн руб.`** (`450 000 руб.`) в основном сценарии и **`0,55 млн руб.`** в неблагоприятном. Мы **не включаем** в доходы мнимую экономию ФОТ контакт-центра: высвобожденное время операторов при сохранении штатного расписания не снижает прямые расходы компании, а перенаправляется на разбор сложных биллинговых обращений и ассистированное подключение семей. Следовательно, точка безубыточности с учётом прямых `OPEX` в основном сценарии возрастает до `(6 000 000 + 450 000) / 500 =` **`12 900` оплаченных номер-месяцев** (в неблагоприятном — `13 100` номер-месяцев).

        Каждая когорта, получившая доступ к услуге в месяце `M` (`1..12`), может принести **в плановом году строго не более `13 - M` дополнительных оплаченных месяцев на один номер** (например, подключение в 12-м месяце даёт максимум 1 месяц в этом году; весь остальной эффект уходит в годы 2–3):

        | Когорта и сценарий (`brief_model`) | Месяц старта `M` | Календарный потолок в году (`13 - M` мес.) | Удержано номеров (допущение) | Средний прирост мес. в плановом году | Оплаченные номер-месяцы в году | Вклад в валовую прибыль года (`* 500 руб.`) | Переходящий эффект в годы 2–3 (вне годового итога) |
        | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
        | **Основной**: 1. Пилот семей (`Q2`) | `5` (май) | `8` мес. | `900` | `3,0` | `2 700` | `+1,35 млн руб.` | `1 800 мес. (+0,90 млн руб.)` |
        | **Основной**: 2. Масштабирование семей (`Q3`) | `7` (июль) | `6` мес. | `3 200` | `2,5` | `8 000` | `+4,00 млн руб.` | `9 600 мес. (+4,80 млн руб.)` |
        | **Основной**: 3. Собственные номера / роутеры (`H2`) | `8` (август) | `5` мес. | `850` | `2,0` | `1 700` | `+0,85 млн руб.` | `2 125 мес. (+1,06 млн руб.)` |
        | **Основной**: 4. Поздний набор семей и SIM (`Q4`) | `10` (октябрь) | `3` мес. | `1 400` | `1,2` | `1 680` | `+0,84 млн руб.` | `4 900 мес. (+2,45 млн руб.)` |
        | **ИТОГО Основной сценарий (`main`)** | — | соблюдён | `6 350` | — | **`14 080`** | **`+7,04 млн руб.`** (минус `0,45 млн OPEX` = **`+6,59 млн` -> `285,59 млн руб.`**) | **`18 425 мес. (+9,21 млн руб.)`** |
        | **ИТОГО Неблагоприятный (`adverse`: `M = 6, 8, 10`, без мульти-SIM)** | `6, 8, 10` | `7, 5, 3` мес. | `3 800` | `1,0–2,2` | **`6 280`** | **`+3,14 млн руб.`** (минус `0,55 млн OPEX` = **`+2,59 млн` -> `281,59 млн руб.`**) | **`8 240 мес. (+4,12 млн руб.)`** |

        **Как позднее проверить реальное удержание по платежам**: сокращение 7-дневных перебоев в Q2 не приравнивается автоматически к годовому удержанию. Аналитик отслеживает фактические ежемесячные списания всех номеров из тестовых и контрольных кластеров пилота Q2 до конца года, **продолжая наблюдать за номером даже после его выхода из семейной группы** (если участник вышел из группы, но остался платным абонентом оператора — это не отток; если перестал платить внутри группы или ушёл из сети — потеря оплаченных месяцев).

        **Отдельный расчёт стоимости разработки (`CAPEX`), формула окупаемости и верхние границы ставок**:
        Поскольку стоимость 1 человеко-месяца `C_pm` в рублях в брифе не задана (`unknown`: `f07_unknown_dev_rate_rub`), затраты на создание услуги не смешиваются с годовой валовой прибылью и оцениваются по формуле накопленного денежного потока по кварталам `q`:
        - **Формула расчётного срока окупаемости**: `T_payback = min { t : sum_{q=1..t} (GP_retention(q) + GP_other(q) - OPEX_direct(q)) >= sum_{q=1..t} PM(q) * C_pm }`, а общая граница минимального числа дополнительных оплаченных месяцев для покрытия годовой цели и прямых расходов равна `N_min = ceil((6 000 000 + OPEX_direct - GP_other) / 500)`.
        - **Предельные вложения для окупаемости внутри планового года**: в основном сценарии чистая дополнительная валовая прибыль за плановый год составляет **`6,59 млн руб.`** (`6 590 000 руб.`), а совокупный объём работ за год равен **`10,0` человеко-месяцев** (`1,5` дизайн + `2,0` аналитика + `3,0` разработка Q2 + `2,5` разработка H2 + `1,0` тестирование). Следовательно, разработка полностью окупается **уже внутри планового года**, если `CAPEX <= 6,59 млн руб.`, то есть при полной внутренней ставке **`C_pm <= 659 000 руб./чел.-мес.`** (при этом до гейта Q2 команда рискует лишь траншем 1-го полугодия `6,00` чел.-мес.: `1,25` в Q1 и `4,75` в Q2). С учётом переходящего эффекта уже привлечённых в 1-м году когорт (`+9,21 млн руб.` в годы 2–3) двухлетний кумулятивный поток достигает **`15,80 млн руб.`**, окупая ставку вплоть до `1,58 млн руб./чел.-мес.`. В неблагоприятном сценарии (`6,0` чел.-мес. без H2 и без внешнего QA, чистый прирост года `+2,59 млн руб.`) потолок годовой окупаемости сжимается до **`2,59 млн руб.`** (`C_pm <= 431 667 руб./чел.-мес.`). Финансовая команда подставляет фактическую ставку `C_pm` перед гейтом Q1 и уточняет решение в конце Q2.

    - id: part_4
      title: "4. Стратегический выбор и план по кварталам"
      deps: [f01_market_and_dedup, f02_scorecard_baseline, f03_metric_definitions, f08_priority_assumption_with_threshold, f09_channel_and_activation_assumptions, f10_profit_bridge_and_capex_inference, f11_year3_scaling_forecast]
      body: |
        ### Сопоставление трёх стратегических вариантов на одной клиентской ситуации и годовом горизонте
        Сравниваем три реалистичных пути для одной ситуации (риск потери интернета у близкого в семейной группе и остановки второй SIM-карты роутера) на горизонте планового года:

        | Параметр сравнения | Вариант 1 (`keep`): оставить текущее обслуживание без изменений | Вариант 2 (`lean`): бережливый пороговый сигнал со ссылкой `deep-link` на существующую передачу ГБ | Вариант 3 (`recommended`): ступенчатая проактивная защита семей (`Q2`) + мульти-SIM на общем движке (`H2`) |
        | --- | --- | --- | --- |
        | **Что получает клиент** | Реактивное ручное выделение ГБ в ЛК после жалобы близкого | Своевременный push/SMS при низком остатке с переходом на старый экран ЛК без переделки согласий и `pending` | Упреждающий сигнал, раздельные отзываемые согласия, действие в 1 экран со статусом `pending` и идемпотентностью, онбординг приглашений + защита SIM роутера |
        | **Доступный охват базы** | `100 000` домохозяйств и `40 000` мульти-SIM в пассивном режиме (`8 000` и `1 000` к концу года) | Только уже активные семейные группы (`100 000` домохозяйств; мульти-SIM не охвачены -> `1 000`) | Оба сегмента без пересечений: `100 000` домохозяйств (`12 200` групп) + `40 000` владельцев своих SIM (`2 050`) |
        | **Трудозатраты (`CAPEX`) и прямые `OPEX`** | `0` чел.-мес., `0 руб.` новых `OPEX` | `~3,0` чел.-мес. за год (`1,5` разработка Q2 + `1,5` аналитика/дизайн/тест), `~0,25 млн руб.` `OPEX` | `10,0` чел.-мес. за год (`6,00` до гейта Q2 + `4,00` в H2 при успехе), `0,45 млн руб.` прямых `OPEX` |
        | **Срок первых результатов** | Сразу, но с продолжением недобора базового года | Через `5–6` недель в Q2 | Пилотный замер через `49` дней после запуска в Q2; полный годовой эффект — Q3–Q4 |
        | **Ожидаемая валовая прибыль года** | `279,00 млн руб.` (`-6,00 млн руб.` к цели) | Около `281,5–282,5 млн руб.` (частичное удержание семей, цель `285 млн руб.` не закрыта) | **`285,59 млн руб.`** в основном сценарии (`281,59 млн руб.` в неблагоприятном) |
        | **Последствия ошибки и условие перехода** | Гарантированный срыв всех 5 целей года и потеря многономерных семей | Повторные нажатия без статуса `pending`, провал цели активации Q4 (`60%`) и мульти-SIM (`2 000`) | Риск перерасхода `CAPEX` снимается поэтапным финансированием: **переход от Варианта 2 к полному тиражу Варианта 3 в Q3 разрешён только если в пилоте Q2 новый экран даёт `>= +2,0 п.п.` дополнительного снижения блокировок или `>= +10 п.п.` успешных передач ГБ поверх `deep-link`** |

        ### Поквартальный план работ, знаний и управленческих решений (`Q1–Q4`)

        | Квартал | Ключевые работы команды и смежников | Что становится известно или доступно к концу квартала | Управленческое решение руководителя |
        | --- | --- | --- | --- |
        | **Q1** | Выгрузка 6-мес. логов порогов/блокировок и дедуплицированных обращений (72 ч); 12–15 интервью; контрбалансированный UX-тест (`AB/BA`); сверка SLA с биллингом, ЛК/ИБ и поддержкой; расчёт ставки 1 чел.-мес. с финансами | Фактическая частота управляемых перебоев (`>= 200` vs `< 100` групп/нед.), задержка остатков в биллинге, готовность раздельных согласий и отзыва, статус выделения `0,5` дизайнера, `0,5` аналитика и `1,0` QA | **Гейт Q1**: одобрить запуск пилота Q2 на совместимых семейных тарифах (или переключить тему на контроль списаний при срабатывании порога логов, либо сузить контур до 1 тарифа при отсутствии QA) |
        | **Q2** | Сборка MVP (`3,0` чел.-мес. разработки), проверка 3 состояний согласия и идемпотентности; проведение 49-дневного кластерного пилота (`6` нед. набора + `7` дн. наблюдения) в рукавах `A / B / C` | `ITT`-оценка снижения 7-дневных блокировок (в п.п. и %), доля операций `completed` в срок и `unknown_status`, выигрыш нового экрана над `deep-link`, первичный срез продления оплаты и точная оценка окупаемости `CAPEX` | **Гейт Q2 (с финансовой командой)**: масштабировать на семьи в Q3 и открыть `2,5` чел.-мес. под мульти-SIM; либо оставить только дешёвый `deep-link`; либо донабрать выборку 3–4 недели; либо остановить проект |
        | **Q3** | Раскатка проверенного семейного решения на CVM-каналы и воронку приглашений (с сохранением `10% holdout`); адаптация бэкенда уведомлений и `pending` для владельцев собственных номеров без шага приглашения (старт в августе) | Фактический инкрементальный прирост семей сверх органики и стоимость привлечения в CVM, раннее удержание когорт мая–июля по реальным платежам, конверсия объединения `>= 2` своих SIM и ясность статуса роутера | Масштабировать только подтверждённые каналы; утвердить объём продвижения мульти-SIM на Q4 либо заморозить неэффективные SMS-касания |
        | **Q4** | Полная работа обоих сегментов в сезонном пике; контроль когорт Q4-активации (с отсчётом 14 полных дней после 31 декабря); сверка годового моста валовой прибыли и удержания (включая вышедшие из групп номера) | Итоговые значения по всем 5 строкам года, фактические 6-месячные кривые удержания семей одинакового размера, реальный `OPEX` и возврат на вложенный `CAPEX` | Утвердить бюджет 2-го года, условия расширения тарифной доступности для 3-летнего ориентира и закрыть/скорректировать недостигнутые цели |

        ### Сводная пятистрочная таблица показателей: основной и неблагоприятный сценарии (`ledger brief-calc`)

        {{BRIEF_SCORECARD_TABLE}}

        **Привязка каждого отклонения от столбца «Без изменений» к действиям команды**:
        1. *Валовая прибыль (`279 -> 285,59 млн руб.` / `281,59 млн руб.`)*: формируется удержанием номеров в семейных группах и на вторых SIM роутеров (`14 080` доп. оплаченных номер-месяцев по `500 руб.` минус `0,45 млн руб.` прямых `OPEX` в `main`; `6 280` номер-месяцев минус `0,55 млн руб.` `OPEX` в `adverse`).
        2. *Активные семейные группы (`5 000 -> 8 296` / `6 760`)*: складываются из расширения подключённой базы (`+2 625` групп при прежней доле `62,5%` в `main`) и роста доли активных групп до `68,0%` (`+671` группа) за счёт своевременных пороговых уведомлений.
        3. *Подключённые семейные группы (`8 000 -> 12 200` / `10 400`)*: закрытие разрыва `+4 000` групп достигается суммой `+3 300` новых CVM-подключений без двойного счёта каналов и `+900` групп, сохранённых от распада благодаря предотвращению блокировок.
        4. *Подключённые владельцы нескольких номеров (`1 000 -> 2 050` / `1 000`)*: в `main` запуск переиспользуемого движка с августа без шага приглашения добавляет `+880` новых и `+170` сохранённых владельцев; в `adverse` сегмент сознательно отложен ради качества ядра, поэтому сохранён прогноз без изменений (`1 000`).
        5. *14-дневная активация в Q4 (`45% -> 62%` / `54%`)*: рост на `+17 п.п.` в `main` обеспечивается прозрачным раздельным согласием при приглашении, напоминанием через 24–72 часа и мгновенным показом остатка после входа (при строгом сохранении всех `440` неотвеченных/отклонённых приглашений в знаменателе `2 000`).

        **Разбор недостижимых целей в неблагоприятном сценарии (`adverse`), цена устранения разрыва и решение руководителя**:

        | Показатель с недобором в `adverse` | Величина разрыва до годовой цели | Цена устранения разрыва | Решение, которое предстоит принять руководителю |
        | --- | --- | --- | --- |
        | **Валовая прибыль** (`281,59` при цели `285,00 млн руб.`) | **`-3,41 млн руб.`** (не хватает `6 820` оплаченных номер-месяцев по `500 руб.`) | Снятие задержки старта Q2 (`1,0` чел.-мес. QA вовремя) + выпуск мульти-SIM в августе (`2,5` чел.-мес. разработки H2) либо перенос зачёта на переходящий хвост (`+4,12 млн руб.` уже накоплено в когортах на 2-й год) | На гейте Q2 выбрать: довыделить `2,5` чел.-мес. разработки и `1,0` QA для добора месяцев в H2 либо официально зафиксировать с финансами перенос части эффекта на Q1 следующего года без закупки убыточного платного трафика |
        | **Активные семейные группы** (`6 760` при цели `8 000`) | **`-1 240` активных групп** | Добор подключённой базы до `12 000` (даёт `+1 040` активных при доле `65%`) + расширение триггеров в ЛК на дополнительные семейные тарифы (`~0,5` чел.-мес. настройки) | Расширять список тарифов в Q3 только при подтверждённой надёжности операций (`unknown_status <= 1%`), не накручивая искусственные пуши ради формальных заходов в ЛК |
        | **Подключённые семейные группы** (`10 400` при цели `12 000`) | **`-1 600` семейных групп** | По штатному CVM-CAC неблагоприятного сценария (`100 руб./группу`) + предложение через поддержку и розницу: около `160–240 тыс. руб.` прямых коммуникаций и обучение 1-й линии | Одобрить подключение витрины поддержки/продаж в Q3 только если удержание привлечённых там групп приносит `>= 1` доп. оплаченного месяца (`500 руб. > 100–150 руб.` затрат) |
        | **Владельцы нескольких номеров** (`1 000` при цели `2 000`) | **`-1 000` владельцев** (нулевой сдвиг к базе без изменений) | Выделение `2,5` чел.-мес. разработки и `0,5` чел.-мес. тестирования в Q3 + `40–50 тыс. руб.` сервисных SMS на основные номера | Если в Q2 ресурс разработки урезан, **официально перенести цель `2 000` на 1-е полугодие 2-го года**, не распыляя команду до стабилизации семейной услуги |
        | **14-дневная активация в Q4** (`54%` при цели `60%`) | **`-6,0 п.п.`** (`90` активированных групп из `1 500` созданных) | Доработка онбординга приглашённого (`0,5` чел.-мес. фронтенда/CVM): автопоказ карточки пакета сразу после акцепта и напоминание за 48 ч до истечения 14 дней | Включить быструю доработку воронки приглашения в спринт начала Q4 перед пиковым набором последнего квартала |

        ### Измеримый ориентир на конец 3-го года и условия масштабирования в годы 2–3
        - **Целевой ориентир конца 3-го года (`forecast`: `f11_year3_scaling_forecast`)**:
          1. **Семейные группы**: **`25 000` подключённых групп** в числителе от **`100 000` доступных домохозяйств** в знаменателе = **`25,0%` охвата доступной базы** (против `6,5%` на старте и `12,2%` в конце 1-го года), при не менее **`17 500` активных групп** за последний месяц 3-го года (`>= 70%`).
          2. **Владельцы нескольких собственных номеров**: **`6 000` подключённых владельцев** в числителе от **`40 000` доступных владельцев** в знаменателе (без двойного счёта пересечений с семьями) = **`15,0%` охвата доступной базы** (против `2,0%` на старте и `5,12%` в конце 1-го года).
        - **Условие изменения самой доступной базы (знаменателя)**: выход за пределы `100 000` домохозяйств (в сторону всего рынка `300 000`) и `40 000` владельцев (в сторону `180 000`) возможен **только при отдельном тарифном решении** коммерческого комитета во 2-м году — открытии опции общего пакета / связки собственных SIM на линейке массовых одиночных и архивных тарифов.
        - **Какие возможности открывает 1-й год и какие данные обязательны перед масштабированием в годы 2–3**: первый год создаёт единый проверенный контур согласий, пороговых триггеров и идемпотентных операций с биллингом. Прежде чем вкладывать деньги в широкое масштабирование 2–3-го годов (включая платные автоправила или расширение тарифов), команда обязана получить по данным 1-го года: (1) фактические **12-месячные кривые удержания семей одинаковой численности** (`2` номера против `3` и `4+` номеров — чтобы отделить истинный вклад услуги от эффекта размера семьи); (2) объём замещения (каннибализации) разовых платных докупок трафика бесплатным перераспределением общего пакета; (3) фактическую рублёвую стоимость сопровождения, SMS-канала и `CAPEX` на один удержанный номер-месяц; (4) долю долгосрочных отзывов согласий участниками.

    - id: part_5
      title: "5. Ресурсы, риски и решение руководителя"
      deps: [f04_current_capabilities_and_roles, f05_team_and_governance_constraints, f06_unknown_incident_and_channel_data, f07_unknown_dev_rate_rub, f10_profit_bridge_and_capex_inference]
      body: |
        ### Оценка трудозатрат в человеко-месяцах, параллельность работ и план при дефиците ресурсов
        Календарный график учитывает, какие задачи выполняются одновременно, а какие блокируются готовностью смежников. Совокупная оценка основного сценария на плановый год составляет **`10,0` человеко-месяцев**, из которых до инвестиционного гейта конца Q2 требуется **`6,00` человеко-месяцев** (`1,25` в Q1 и `4,75` в Q2 без учёта штатного руководителя направления; оставшиеся `4,00` чел.-мес. в H2 открываются только при успехе пилота):

        | Роль | Что известно на старте (из брифа) | Потребность в чел.-мес. (`Q1 / Q2 / H2`, всего) | Параллельность и очерёдность работ | План упрощения / переноса при дефиците или отказе |
        | --- | --- | --- | --- | --- |
        | **Руководитель направления** | Уже определён | В рамках текущего назначения (`Q1–Q4`) | Ведёт согласование SLA смежников в Q1 параллельно с аналитикой; проводит гейты Q1/Q2; владеет кнопкой экстренной остановки пилота по приватности | Не делегируется; при перегрузке сокращается число вторичных CVM-экспериментов в Q3 |
        | **Дизайнер** | `0,5` ставки ещё предстоит выделить | **`1,5` чел.-мес.** (`0,75` в Q1; `0,50` в Q2; `0,25` в Q3 под мульти-SIM) | В Q1 работает **параллельно с аналитиком**: собирает экраны приглашения, раздельных согласий и `pending`, ведёт контрбалансированный UX-тест `AB/BA` | При выделении только на Q1 (`0,75` чел.-мес.) в Q2–Q3 используются штатные дизайн-компоненты существующего ЛК без кастомной графики |
        | **Аналитик** | `0,5` ставки ещё предстоит выделить | **`2,0` чел.-мес.** (по `0,50` чел.-мес. в каждом из `Q1–Q4`) | В Q1 параллельно с дизайном выгружает 6-мес. логи и дедуплицирует обращения; в Q2 считает `ITT` и темп набора; в H2 ведёт когорты удержания | Критическая роль для чистоты пилота: без выделения `0,5` аналитика в Q1 запуск разработки в Q2 откладывается до снятия базовых чисел |
        | **Разработчики** | На Q2 предварительно выделено `3,0` чел.-мес. | **`5,5` чел.-мес. за год**: `3,0` в Q2 (семейный MVP) + `2,5` в H2 (тираж и мульти-SIM после гейта Q2) | Разработка в Q2 стартует **только после** фиксации контракта API биллинга и правил согласий ИБ в конце Q1; внутри Q2 бэкенд триггеров и фронтенд ЛК идут параллельно (`5–6` календарных недель силами 2–3 инженеров) | При урезании лимита Q2 (напр., до `1,5–2,0` чел.-мес.): откладываем новый экран управления и мульти-SIM, запускаем бережливый триггер + раздельные согласия + `deep-link` на штатную передачу ГБ; выход на мульти-SIM в H2 требует отдельных `2,5` чел.-мес. |
        | **Специалист по проверке услуги (QA)** | `1,0` чел.-мес. пока **не подтверждён** | **`1,0` чел.-мес.** (`0,75` в Q2 перед пилотом + `0,25` в Q3 перед мульти-SIM) | Подключается со 2-го месяца Q2 параллельно сборке стенда: проверяет совместимость тарифов, 3 состояния согласий, гонки `pending` и повторные нажатия | **План при неподтверждении `1,0` чел.-мес. QA**: `0,5` чел.-мес. из бюджета разработки Q2 переводится на автотесты идемпотентности и отзыва согласий; ручную приёмку отказов ведут руководитель направления и аналитик по чек-листу; охват пилота сужается до **одного** массового семейного тарифа и только операции выделения ГБ, старт сдвигается на `2–3` недели, а годовой прогноз смещается к сценарию `adverse` (`281,59 млн руб.`) |

        ### Предстартовые зависимости со смежниками и запасной контур при неготовности
        Ни одна строка клиентского кода не выходит в пилот Q2 без закрытия трёх предстартовых зависимостей в Q1:

        | Зависимая система и ответственный | Срок закрытия | Что именно должно быть подтверждено к старту пилота | Запасной объём работ при недоступности к началу Q2 и влияние на прогноз |
        | --- | --- | --- | --- |
        | **Система расчётов (Владелец биллинга)** | До конца 8-й недели `Q1` | Максимальная задержка обновления остатков ГБ и баланса, список совместимых семейных тарифов, конечный статус операции (`completed / failed`) и приём `idempotency_key` | Если синхронный API идемпотентности задерживается — в Q2 проверяем пороговый сигнал + `deep-link` на существующую операцию ЛК с блокировкой повторного клика на шлюзе (5 мин) на одном тарифе; прогноз прибыли снижается в сторону `281,59 млн руб.` |
        | **Личный кабинет и ИБ (Владельцы ЛК и безопасности)** | До конца 10-й недели `Q1` | Раздельное хранение `data_quota_view` и `charges_view`; стендовая проверка видимости сведений **до выдачи разрешения, после выдачи и сразу после отзыва** | **Компромисс по приватности запрещён**: при неготовности мгновенного отзыва согласия показ чужих остатков не запускается; в Q2 тестируется только воронка приглашений без раскрытия данных либо переносится вперёд сценарий собственных номеров одного владельца (семейные цели Q2–Q3 сдвигаются на 1 квартал) |
        | **Служба поддержки (Руководитель КЦ)** | До конца 11-й недели `Q1` | Инструмент поиска спорной операции по номеру/`idempotency_key`, видимость статуса `pending` для оператора и скрипт объяснения дальнейших действий клиенту | Ограничиваем выборку пилота `600–1 200` группами и организуем прямую дежурную очередь 2-й линии с аналитиком команды без массовой раскатки до готовности инструмента КЦ |

        ### Что делать при отклонении от плана: матрица рисков и стоп-правил

        | Риск, меняющий решение | Наблюдаемый признак (триггер) | Последствия при бездействии | Ответственный | Обязательное действие и условие возобновления / закрытия |
        | --- | --- | --- | --- | --- |
        | **1. Раскрытие чужих данных после отзыва согласия** | Хотя бы `1` подтверждённый случай (в мониторинге, тесте или жалобе), когда организатор видит остаток ГБ или начисления участника после отзыва согласия | Нарушение тайны связи и персональных данных, потеря доверия и регуляторный риск | **Руководитель направления** (совместно с ЛК и ИБ) | **Немедленная приостановка всего пилота руководителем направления** и отключение эндпоинта чтения данных группы. Возобновление только после устранения кэширования, ревизии всех отозванных согласий и прохождения автотеста 3 состояний (`до / после / отзыв`) с нулём ошибок |
        | **2. Двойное списание денег или двойное вычитание ГБ из общего пакета** | Списание двух платежей или двукратное вычитание выданного объёма ГБ по одному действию клиента | Прямой финансовый ущерб клиентам, преждевременное исчерпание семейного пакета, всплеск претензий в КЦ | **Владелец системы расчётов (биллинга)** + Поддержка | **Немедленная остановка новых спорных операций владельцем биллинга**, полная сверка реестра исполненных операций, автовозврат денег/ГБ и передача списков в поддержку для проактивной помощи клиентам. **Проверка исправления перед перезапуском**: стендовый прогон `1 000` дублирующих запросов и сетевых таймаутов с одним `idempotency_key` (`0` двойных проводок) + почасовая сверка первых 24 часов |
        | **3. Малый набор подходящих клиентов в пилоте Q2** | Поток впервые подходящих семейных групп ниже `120` в неделю (набор за 6 недель `< 720` групп при плане `1 200`) | Широкие доверительные интервалы: невозможно надёжно отделить пользу от случайного шума к концу Q2 | **Аналитик направления** | Аналитик раскладывает узкое место (узкий фильтр тарифа, доля согласий или редкий порог), пересчитывает срок набора и докладывает комитету, **что именно успеет стать известно в Q2** (техническая безотказность операции и конверсия в клик), предлагая продлить наблюдение на `3–4` недели в начале Q3 до решения о широкой застройке |
        | **4. Услугой пользуются, но оплаченных месяцев не прибавилось** | В когортах Q2–Q3 клиенты активно перераспределяют ГБ, но прирост оплаченных номер-месяцев к контрольной группе статистически неотличим от нуля или ниже траектории окупаемости | Рост прямых затрат на SMS и отвлечение разработки без приближения к цели `285 млн руб.` (риск каннибализации докупок трафика) | **Финансовая команда** и **Руководитель направления** | Финансы пересчитывают юнит-экономику: отключаем платные SMS-триггеры (оставляя бесплатные push/in-app, снижая новые `OPEX` почти к нулю) и сужаем охват до сегмента с высоким риском оттока (вторые SIM роутеров и новые группы 1-го месяца). **Порог прекращения финансирования**: если даже при урезанных `OPEX` чистый годовой вклад не даёт положительного возврата и срок окупаемости новых вложений превышает `24 месяца`, разработка H2 (`2,5` чел.-мес.) закрывается |

        ### Конкретный запрос к руководителю сегодня (на Q1 и развилку Q2)
        1. **Решение, требуемое к концу 1-го квартала (и ресурс на старт Q1 уже сейчас)**:
           - Выделить на Q1 по **`0,5` ставки дизайнера** (`0,75` чел.-мес.) и **`0,5` ставки аналитика** (`0,50` чел.-мес.) без нового денежного бюджета разработки для выгрузки 6-месячных логов, проведения 12–15 интервью, контрбалансированного UX-теста и закрытия предстартовых проверок с владельцами биллинга, ЛК/ИБ и поддержки (ответственный за результат — **руководитель продуктового направления**).
           - В конце Q1, при подтверждении логами потока `>= 100–200` уникальных подходящих семей в неделю и готовности отзыва согласий, утвердить сфокусированный объём пилота Q2 — **проверку одной причины (исчерпание выделенной доли интернета) на совместимых семейных тарифах с общим пакетом** — закрепив предварительно выделенные **`3,0` чел.-мес. разработки**, подтвердив **`1,0` чел.-мес. специалиста по проверке услуги** и согласовав до `60 тыс. руб.` прямого лимита на сервисные SMS пилота (а также внутреннюю рублёвую ставку 1 чел.-мес. от финансов).
        2. **Что руководство увидит в конце 2-го квартала и какой выбор сделает**:
           - К концу Q2 руководитель и финансовая команда получат верифицированный отчёт 49-дневного кластерного пилота: `ITT`-оценку снижения 7-дневных блокировок интернета (в п.п. и относительных % с 95% интервалами Вильсона), сравнение полного экрана `C` с бережливым `deep-link` `B`, долю операций `completed` в срок и `unknown_status`, отчёт `0` нарушений согласий и двойных списаний, а также пересчитанный по фактической ставке ФОТ срок окупаемости.
           - На этой основе комитет выберет ровно один из четырёх заранее оцифрованных ходов: **(а) масштабировать** семейное решение в Q3 и открыть `2,5` чел.-мес. разработки H2 для выхода на владельцев собственных номеров под цель `285,59 млн руб.`; **(б) оставить только бережливый сигнал с `deep-link`**, сэкономив разработку H2; **(в) продлить наблюдение** на 3–4 недели при малом потоке без новых затрат на стройку; **(г) остановить финансирование** при несходимости экономики удержания.
