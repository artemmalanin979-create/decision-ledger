<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Decision Ledger — ИИ-стратег продуктового комитета">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111E33"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Base card -->
  <rect x="0" y="0" width="1280" height="360" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="360" rx="14" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="358.5" rx="13.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="48" y="0" width="260" height="2.5" fill="url(#accentLine)"/>

  <!-- Left column: product leader positioning -->
  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="48" y="42" width="8" height="8" rx="2" fill="#2DD4BF"/>
    <text x="65" y="50" fill="#5EEAD4" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="600">MGIMO×AI CHALLENGE 2026 · НОМИНАЦИЯ «ИИ-ПРОЕКТ» · ФАБРИКА ПРОДУКТОВ МЕГАФОНА</text>

    <text x="48" y="106" fill="#F8FAFC" font-family="'Inter Display', 'Inter', -apple-system, sans-serif" font-size="45" font-weight="700" letter-spacing="-0.9">Decision Ledger</text>

    <text x="48" y="144" fill="#F1F5F9" font-family="'Inter Display', 'Inter', sans-serif" font-size="18.5" font-weight="600">ИИ-стратег продуктового комитета в рабочей папке IDE:</text>
    <text x="48" y="170" fill="#E2E8F0" font-size="17.5" font-weight="500">от сырого запроса и открытых данных — к защищаемой стратегии</text>

    <text x="48" y="210" fill="#94A3B8" font-size="13.5">Считает маржу, пороги смены решения и 95% ДИ Вильсона вне окна LLM, блокирует завышенные</text>
    <text x="48" y="231" fill="#94A3B8" font-size="13.5">обещания маркетинга и точечно пересматривает выводы в новых чатах при смене условий рынка.</text>

    <!-- Compatibility & foundation strip -->
    <g font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#CBD5E1">
      <rect x="48" y="276" width="228" height="34" rx="6" fill="#111C2E" stroke="#26354D" stroke-width="1"/>
      <text x="162" y="297" text-anchor="middle">Cursor · Codex · Grok CLI</text>

      <rect x="284" y="276" width="166" height="34" rx="6" fill="#111C2E" stroke="#26354D" stroke-width="1"/>
      <text x="367" y="297" text-anchor="middle">Python 3.11+ · 0 pip</text>

      <rect x="458" y="276" width="148" height="34" rx="6" fill="#111C2E" stroke="#26354D" stroke-width="1"/>
      <text x="532" y="297" text-anchor="middle">SHA-256 + FTS5</text>

      <rect x="614" y="276" width="136" height="34" rx="6" fill="#111C2E" stroke="#26354D" stroke-width="1"/>
      <text x="682" y="297" text-anchor="middle">44 автотеста OK</text>
    </g>
  </g>

  <!-- Right column: product committee decision lifecycle -->
  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="774" y="34" width="458" height="292" rx="10" fill="#111A2C" stroke="#26354D" stroke-width="1.2"/>
    <line x1="775" y1="72" x2="1231" y2="72" stroke="#1E293B" stroke-width="1"/>

    <circle cx="796" cy="53" r="4" fill="#2DD4BF"/>
    <text x="808" y="57" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700">ПУТЬ РЕШЕНИЯ КОМИТЕТА</text>
    <text x="1212" y="57" text-anchor="end" fill="#5EEAD4" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="600">CLI + MCP</text>

    <!-- Vertical connector -->
    <line x1="807" y1="108" x2="807" y2="286" stroke="#26354D" stroke-width="1.5"/>

    <!-- Step 1 -->
    <rect x="792" y="88" width="422" height="48" rx="7" fill="#152238" stroke="#26354D" stroke-width="1"/>
    <text x="806" y="109" fill="#5EEAD4" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700">01</text>
    <text x="832" y="109" fill="#F8FAFC" font-size="13" font-weight="600">Рамки комитета и открытые источники</text>
    <text x="832" y="126" fill="#94A3B8" font-size="11.5">До 3 вопросов · HTTPS-снимки SHA-256 · защита от инъекций</text>

    <!-- Step 2 -->
    <rect x="792" y="146" width="422" height="48" rx="7" fill="#152238" stroke="#26354D" stroke-width="1"/>
    <text x="806" y="167" fill="#5EEAD4" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700">02</text>
    <text x="832" y="167" fill="#F8FAFC" font-size="13" font-weight="600">Юнит-экономика, интервалы и барьеры UX</text>
    <text x="832" y="184" fill="#94A3B8" font-size="11.5">Пороги смены решения · 95% ДИ Вильсона · живые экраны</text>

    <!-- Step 3 -->
    <rect x="792" y="204" width="422" height="48" rx="7" fill="#152238" stroke="#26354D" stroke-width="1"/>
    <text x="806" y="225" fill="#5EEAD4" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700">03</text>
    <text x="832" y="225" fill="#F8FAFC" font-size="13" font-weight="600">Согласованные стратегии и гейт выбора</text>
    <text x="832" y="242" fill="#94A3B8" font-size="11.5">JTBD · дерево OST · Pre-mortem · стоп-лист обещаний</text>

    <!-- Step 4 -->
    <rect x="792" y="262" width="422" height="48" rx="7" fill="#132A2E" stroke="#0F766E" stroke-width="1"/>
    <text x="806" y="283" fill="#5EEAD4" font-family="'Source Code Pro', 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700">04</text>
    <text x="832" y="283" fill="#F8FAFC" font-size="13" font-weight="600">Сопровождение после решения в новых чатах</text>
    <text x="832" y="300" fill="#99F6E4" font-size="11.5">Транзитивный impact при новых данных · БЗ FTS5</text>
  </g>
</svg>
