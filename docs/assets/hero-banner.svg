<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Decision Ledger — Стратег Фабрики продуктов">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111E33"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Base card -->
  <rect x="0" y="0" width="1280" height="360" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="360" rx="14" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="358.5" rx="13.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="48" y="0" width="240" height="2.5" fill="url(#accentLine)"/>

  <!-- Left column: identity & thesis -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="48" y="42" width="8" height="8" rx="2" fill="#2DD4BF"/>
    <text x="66" y="50" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.8">MGIMO×AI CHALLENGE 2026 · НОМИНАЦИЯ «ИИ-ПРОЕКТ» · МЕГАФОН</text>

    <text x="48" y="106" fill="#F8FAFC" font-size="44" font-weight="700" letter-spacing="-0.8">Decision Ledger</text>

    <text x="48" y="144" fill="#E2E8F0" font-size="18" font-weight="500">ИИ-агент продуктовой и коммуникационной стратегии</text>
    <text x="48" y="170" fill="#E2E8F0" font-size="18" font-weight="500">с детерминированным расчётом и проверяемой памятью решений</text>

    <text x="48" y="210" fill="#94A3B8" font-size="13.5">Ведёт руководителя продукта от размытого запроса до выбора комитета и сопровождает решение</text>
    <text x="48" y="231" fill="#94A3B8" font-size="13.5">в новых сеансах: хранит SHA-256 снимки, считает ДИ Вильсона и пересматривает граф оснований.</text>

    <!-- Spec chips -->
    <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#CBD5E1">
      <rect x="48" y="276" width="160" height="34" rx="6" fill="#111C2E" stroke="#26354D" stroke-width="1"/>
      <text x="128" y="297" text-anchor="middle">Python 3.11+ stdlib</text>

      <rect x="218" y="276" width="160" height="34" rx="6" fill="#111C2E" stroke="#26354D" stroke-width="1"/>
      <text x="298" y="297" text-anchor="middle">0 pip-зависимостей</text>

      <rect x="388" y="276" width="178" height="34" rx="6" fill="#111C2E" stroke="#26354D" stroke-width="1"/>
      <text x="477" y="297" text-anchor="middle">SQLite SHA-256 + FTS5</text>

      <rect x="576" y="276" width="164" height="34" rx="6" fill="#111C2E" stroke="#26354D" stroke-width="1"/>
      <text x="658" y="297" text-anchor="middle">CLI + MCP JSON-RPC</text>
    </g>
  </g>

  <!-- Right column: architectural verification pipeline card -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="780" y="34" width="452" height="292" rx="10" fill="#111A2C" stroke="#26354D" stroke-width="1.2"/>
    <line x1="781" y1="72" x2="1231" y2="72" stroke="#1E293B" stroke-width="1"/>

    <circle cx="802" cy="53" r="4" fill="#2DD4BF"/>
    <text x="814" y="57" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.5">КОНТУР ВЕРИФИКАЦИИ</text>
    <text x="1212" y="57" text-anchor="end" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600">26 ТЕСТОВ · OK</text>

    <!-- Vertical connector -->
    <line x1="813" y1="108" x2="813" y2="286" stroke="#26354D" stroke-width="1.5"/>

    <!-- Step 1 -->
    <rect x="798" y="88" width="416" height="48" rx="7" fill="#152238" stroke="#26354D" stroke-width="1"/>
    <text x="812" y="109" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700">01</text>
    <text x="838" y="109" fill="#F8FAFC" font-size="13" font-weight="600">Маршрутизация и сбор источников</text>
    <text x="838" y="126" fill="#94A3B8" font-size="11.5">ledger route · zero-LLM таблицы · fast-субагент · UX-макеты</text>

    <!-- Step 2 -->
    <rect x="798" y="146" width="416" height="48" rx="7" fill="#152238" stroke="#26354D" stroke-width="1"/>
    <text x="812" y="167" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700">02</text>
    <text x="838" y="167" fill="#F8FAFC" font-size="13" font-weight="600">Когортная статистика и юнит-экономика</text>
    <text x="838" y="184" fill="#94A3B8" font-size="11.5">95% ДИ Вильсона · парадокс Симпсона · стресс затрат +15%</text>

    <!-- Step 3 -->
    <rect x="798" y="204" width="416" height="48" rx="7" fill="#152238" stroke="#26354D" stroke-width="1"/>
    <text x="812" y="225" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700">03</text>
    <text x="838" y="225" fill="#F8FAFC" font-size="13" font-weight="600">Аудит обещаний и гейт комитета</text>
    <text x="838" y="242" fill="#94A3B8" font-size="11.5">audit-claims против оверклейма · accept --expect &lt;sha&gt;</text>

    <!-- Step 4 -->
    <rect x="798" y="262" width="416" height="48" rx="7" fill="#132A2E" stroke="#0F766E" stroke-width="1"/>
    <text x="812" y="283" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700">04</text>
    <text x="838" y="283" fill="#F8FAFC" font-size="13" font-weight="600">Возобновление в новом чате и БЗ</text>
    <text x="838" y="300" fill="#99F6E4" font-size="11.5">Транзитивный impact · FTS5 БЗ (can_cite_as_fact = false)</text>
  </g>
</svg>
