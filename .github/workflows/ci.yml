name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Python ${{ matrix.python-version }} · stdlib tests & repo audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit test suite (0 external dependencies)
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Run repository security, PII & full git-history audit
        run: python3 -m ledger audit-repo . --history

      - name: Smoke-check CLI analytics on demo dataset
        run: |
          python3 -m ledger rates examples/retail-backup/later/recount.csv \
            --group group --segment cohort --denominator drills \
            --numerators network_recovered checkout_completed false_success \
            --ci --guardrail "checkout_completed>=0.90" --guardrail "false_success<=0.03" >/dev/null
          python3 -m ledger economics examples/retail-backup/initial/economics.json >/dev/null
